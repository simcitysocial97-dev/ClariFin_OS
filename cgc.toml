[project]
name = "ClariFin_OS"
root = "."

[indexer]
# Precise blocklist for your frontend & backend build noise/virtual environments
exclude = [
    "**/node_modules/**",
    "**/venv/**",
    "**/.venv/**",
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.pyo",
    "**/*.pyd",
    "**/.git/**",
    "**/.pytest_cache/**",
    "**/.mypy_cache/**",
    "**/.ruff_cache/**",
    "**/frontend/.next/**",
    "**/frontend/dist/**",
    "**/frontend/build-errors-complete.log",
    "**/backend/test.db"
]

# Explicitly mapping your actual directory structure
include = [
    "backend/src/**/*.py",
    "frontend/app/**/*.ts",
    "frontend/app/**/*.tsx",
    "frontend/components/**/*.ts",
    "frontend/components/**/*.tsx",
    "frontend/lib/**/*.ts",
    "frontend/hooks/**/*.ts",
    "frontend/types/**/*.ts"
]

[server]
watch = true
backend = "falkordb"
