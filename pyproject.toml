[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# =============================================================================
# ClariFin_OS — SINGLE Python Dependency Authority (M10)
#
# Every Python dependency for the repository — runtime, backend, development
# tooling, verification tooling — is declared HERE and nowhere else.
#
#   Declaration  (this file, exact pins = version policy)
#       |
#       +--> resolution  (pip resolves transitives deterministically)
#       |
#       +--> lock        (requirements.lock — regenerable snapshot, NOT a
#                         second authority; produced by scripts/freeze-env.sh)
#       |
#       +--> local env   (./.venv via scripts/bootstrap.sh)
#       +--> CI env      (.github/actions/setup-python-runtime — consumes the
#                         SAME `pip install -e ".[all]"` contract)
#
# The previous independent authorities were:
#   * backend/requirements.txt          -> OBSOLETE  (folded into [project])
#   * backend/requirements-frozen.txt   -> OBSOLETE  (stale, contained poisoned
#                                        entries httpcore2/httpx2/truststore,
#                                        pytest 8.3.0 vs declared 9.x)
#   * setup-python-runtime inline tools -> OBSOLETE  (now [all] optional deps)
#
# NOTE: the root repository is a single-venv architecture (./.venv). The
# backend is source-only (installed via backend/src on sys.path at test time),
# so all backend runtime dependencies are declared here at root.
# =============================================================================

[project]
name = "clarinfin-verification"
version = "1.0.0"
description = "ClariFin OS — Unified Verification Runtime & single Python environment"
requires-python = ">=3.12"
dependencies = [
    # ── Runtime / verification CLI ────────────────────────────────────────────
    "click==8.4.2",
    # ── Backend runtime ──────────────────────────────────────────────────────
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "pdfplumber==0.11.10",
    "camelot-py[cv]==2.0.0",
    "ghostscript==0.8.1",
    "pandas==3.0.5",
    "python-dateutil==2.9.0",
    "cachetools==7.1.8",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
# Verification / development tooling. Installed via `pip install -e ".[all]"`.
verification = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    "hypothesis==6.167.1",
    "coverage==7.16.0",
    "ruff==0.16.6",
    "black==26.5.1",
    "mypy==2.3.1",
    "mutmut==3.7.0",
]
# Contract testing (schemathesis) - optional, install via `pip install -e ".[contract]"`
contract = [
    "schemathesis==4.25.2",
]
all = ["clarinfin-verification[verification]", "clarinfin-verification[contract]"]

[project.scripts]
verify = "runtime.foundation.verification.cli.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*"]

# ── Canonical lint / format / type-check configuration (repo-wide) ───────────
# Ruff, Black and (repo-scope) Mypy are defined here. Backend stays source-only;
# backend-specific Mypy strictness, pytest, Mutmut and Hypothesis configuration
# remain in backend/pyproject.toml (their scoped authority — backend rootdir).

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings  
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modern Python syntax)
    "SIM",    # flake8-simplify
]

ignore = [
    "E501",   # line too long — Black/ruff format handles this
    "E402",   # module level import not at top of file (common in scripts/tests)
    "B008",   # do not perform function calls in default arguments (FastAPI uses this)
    "B017",   # assertRaises(Exception) in tests intentionally tests broad immutability guard
    "B024",   # BaseProvider/MutationBackendBase are ABC with concrete shared state + template hooks
    "B027",   # _setup_models/cancel/cleanup are intentional no-op template hooks
    "SIM108", # ternary operator — sometimes less readable
    # M9-C46 (Category F — intentional architectural pattern, documented):
    # UP042 suggests migrating `class X(str, Enum)` -> `enum.StrEnum`. The
    # certified C42.38 verification models (runtime/foundation/verification/*)
    # intentionally use the `str` + `Enum` mixin because evidence serializers
    # rely on `str(member)` == "ClassName.MEMBER" semantics; `StrEnum` changes
    # `__str__` to return the bare value, which would silently alter evidence
    # JSON contracts. Conversion is deferred until serializers are contract-tested.
    "UP042",
]

exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "backend/tests/generated",
    "backend/mutants",
    "backend/tests/mutation_infra/mutants/**",
    "backend/src/stubs",
    "*.pyc",
    # M9-C46 (Category E — generated surface): milestone evidence/scenario
    # scripts produced by verification runs. Mirrors the existing Black
    # extend-exclude; hand-editing generated artifacts is forbidden.
    "runtime/generated/**",
]

[tool.ruff.lint.per-file-ignores]
# Test files can use assert, magic values, etc.
"backend/tests/**" = ["S101", "S105", "S106", "PLR2004"]
# Migration files may have long strings
"backend/migrations/**" = ["E501"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | backend/mutants
  | backend/tests/mutation_infra/mutants
  | backend/tests/generated
  | backend/src/stubs
  | runtime/generated
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
# backend/src modules (`src.*`) are imported by runtime verification code;
# the root pytest config already puts backend/src on the path — mirror it here.
mypy_path = ["backend/src"]
# M9-C46 typing boundaries (documented):
#   * backend/ is its own STRICT typing boundary (backend/pyproject.toml
#     [tool.mypy] strict=true, rootdir=backend), gated by scripts/verify-fast.sh.
#     It MUST be excluded here: including it under repo-scope settings creates
#     duplicate module identities (backend/src as "src.*" vs "<repo-relative>")
#     and re-checks strict-passing code under a weaker, conflicting config.
#     Cross-boundary `src.*` imports from runtime code are covered by the
#     targeted src.* override below.
#   * runtime/generated/ holds non-importable milestone evidence scripts
#     (hyphenated dirs abort discovery entirely).
exclude = [
    'backend/',
    'servers/src/fetch/tests/',
    'backend/mutants/',
    'runtime/generated/',
]

[[tool.mypy.overrides]]
# Cross-boundary imports: runtime verification code imports backend `src.*`
# modules. backend/src is type-checked by its own strict boundary; at repo
# scope the module source is excluded (see above), so these imports are
# treated as untyped rather than errors.
module = ["src.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Third-party libraries without py.typed markers / stubs in the dependency
# contract (pyyaml, jinja2). Not code defects.
module = ["yaml", "jinja2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
norecursedirs = [
    ".*",
    "backend/mutants",
    "backend/tests/mutation_infra/mutants",
    "backend/tests/invariants/_m4_exit_probe/**",
    "backend/tests/probes",
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "node_modules",
    "frontend/node_modules"
]
pythonpath = ["backend", "backend/src", "backend/tests"]
markers = [
    "capability: mark test as capability smoke test",
    "contract: mark test as contract test",
    "property: mark test as property test",
    "invariant: mark test as invariant test",
    "golden: mark test as golden dataset test",
    "meta: mark test as meta test",
    "slow: marks tests as slow (deselect with '-m not slow')",
    "mutation: marks tests specifically for mutation testing",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "performance: marks performance tests",
]
