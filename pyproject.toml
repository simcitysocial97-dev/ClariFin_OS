[project]
name = "clarinfin-verification"
version = "1.0.0"
description = "ClariFin OS Verification Runtime CLI"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
]

[project.scripts]
verify = "runtime.foundation.verification.cli.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*"]

[tool.mypy]
python_version = "3.12"
exclude = ['servers/src/fetch/tests/']

[tool.ruff]
line-length = 100
target-version = "py312"
