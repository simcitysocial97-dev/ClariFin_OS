# .github/actions/upload-runtime/action.yml
# Canonical artifact uploader for the Engineering Runtime.
#
# Rule 3 & 4: every artifact upload goes through this action — no workflow
# inlines actions/upload-artifact directly. This guarantees a single,
# consistent retention + naming policy.
#
# Inputs:
#   name            Artifact name (must be unique within the workflow run).
#   path            Paths to upload (newline-separated).
#   retention-days  Retention in days (default 14, per the artifact lifecycle).
#   if-condition    Step condition (default: always(), so failures still upload).

name: "Upload Runtime Artifacts"
description: "Standardized artifact upload with canonical retention policy."

inputs:
  name:
    description: "Artifact name"
    required: true
  path:
    description: "Paths to upload (newline or space separated)"
    required: true
  retention-days:
    description: "Retention in days"
    required: false
    default: "14"
  if-condition:
    description: "Condition for upload"
    required: false
    default: "always()"
  if-no-files-found:
    description: "What to do when no files match the path (warn|ignore|error)"
    required: false
    default: "warn"

runs:
  using: "composite"
  steps:
    - name: Upload ${{ inputs.name }}
      if: ${{ inputs.if-condition }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
