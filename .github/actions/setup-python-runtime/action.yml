# .github/actions/setup-python-runtime/action.yml
# Canonical Python environment for the Engineering Runtime.
# Used by EVERY workflow via bootstrap-runtime. Never duplicated.
# Rule 1 & 3: all Python setup lives here; no workflow inlines pip/cache logic.

name: "Setup Python Runtime"
description: "Installs Python 3.12, the root runtime package, backend deps, and verification tooling. Caches pip."

inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.12"
  working-directory:
    description: "Directory containing backend dependencies (repo root by default)"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: |
          pip-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('pyproject.toml', 'backend/requirements*.txt', 'backend/pyproject.toml') }}
        restore-keys: |
          pip-${{ runner.os }}-py${{ inputs.python-version }}-
          pip-${{ runner.os }}-

    - name: Configure pip
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip config set global.timeout 300
        pip config set global.retries 10

    - name: Install runtime package (editable)
      shell: bash
      run: |
        pip install --timeout 300 --retries 10 -e . 2>/dev/null || pip install --timeout 300 --retries 10 -e .

    - name: Install backend dependencies
      shell: bash
      run: |
        if [ -f backend/requirements.txt ]; then
          pip install --timeout 300 --retries 10 -r backend/requirements.txt
        elif [ -f backend/pyproject.toml ]; then
          pip install --timeout 300 --retries 10 -e backend/ 2>/dev/null || true
        fi

    - name: Install verification tooling
      shell: bash
      run: |
        pip install --timeout 300 --retries 10 \
          ruff \
          black \
          mypy \
          coverage \
          pytest-xdist \
          pytest-timeout \
          hypothesis

    - name: Verify environment
      shell: bash
      run: |
        python --version
        pytest --version
        python runtime/verify.py 2>/dev/null || true
        echo "Environment ready"
