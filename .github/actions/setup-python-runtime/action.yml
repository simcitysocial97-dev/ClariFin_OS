# .github/actions/setup-python-runtime/action.yml
# Canonical Python environment for the Engineering Runtime.
# Used by EVERY workflow via bootstrap-runtime. Never duplicated.
# Rule 1 & 3: all Python setup lives here; no workflow inlines pip/cache logic.

name: "Setup Python Runtime"
description: "Installs Python 3.12, the root runtime package, backend deps, and verification tooling. Caches pip and the constructed virtual environment."

inputs:
  python-version:
    description: "Python version"
    required: false
    default: "3.12"


runs:
  using: "composite"
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    # M11 — the cache key must name the EXACT interpreter, not the requested
    # range. `python-version: "3.12"` resolves to whatever patch release the
    # runner image ships (3.12.3 today, 3.12.7 next month), and `.venv`
    # records that interpreter in `pyvenv.cfg` (`home =
    # /opt/hostedtoolcache/Python/<X.Y.Z>/x64`). A key built from the
    # requested range would therefore hand a 3.12.3 environment to a 3.12.7
    # runner, whose base interpreter no longer exists on disk — every
    # `.venv/bin/*` script would fail with "no such file or directory" at exec
    # time, long after the cache step reported success. The full version is
    # resolved from the interpreter setup-python actually installed.
    - name: Resolve Python toolchain identity
      id: pytool
      shell: bash
      run: |
        set -euo pipefail
        FULL="$(python -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])')"
        echo "full=${FULL}" >> "$GITHUB_OUTPUT"
        echo "::notice::Python toolchain resolved to ${FULL} for the virtual-environment cache key."

    - name: Set deterministic locale/TZ (ED7)
      shell: bash
      run: |
        echo "TZ=UTC" >> $GITHUB_ENV
        echo "LC_ALL=C.UTF-8" >> $GITHUB_ENV
        echo "LANG=C.UTF-8" >> $GITHUB_ENV

    - name: Cache pip packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: |
          pip-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          pip-${{ runner.os }}-py${{ inputs.python-version }}-
          pip-${{ runner.os }}-

    # M11 — cache the CONSTRUCTED virtual environment, not just pip's download
    # cache. Measured on this repository (4-core host, loadavg ~9.6, so
    # inflated; the ratio, not the absolute value, is the finding):
    #
    #   python -m venv .venv                     19.84 s
    #   pip install --upgrade pip                 9.86 s
    #   pip install -e ".[all]" (pip cache warm) 257.75 s   <- the cost
    #   ------------------------------------------------------------
    #   total cold, pip cache already warm        287.45 s
    #
    # Every one of the 15 jobs that calls bootstrap-runtime paid that, and the
    # Runtime Verification critical path (16m35s measured on PR #16) contained
    # ~5 minutes of it. pip's download cache already existed, so none of the
    # 257 s was network time: it was unpacking and linking 601 MB of wheels.
    # That work is a pure function of the declared dependency set, so it is
    # exactly what a cache is for.
    #
    # WHY pip STILL RUNS ON A CACHE HIT. The cache is an accelerator for
    # unpacking, never the authority on what is installed:
    #   * `pip install -e ".[all]"` runs unconditionally. Measured re-resolve
    #     cost with everything already satisfied: 31.69 s, against 257.75 s
    #     cold — so the win is ~220 s per job and dependency resolution still
    #     happens on every run.
    #   * That keeps upstream drift observable. `pyproject.toml` pins 15 of its
    #     16 direct dependencies exactly and leaves one floating range
    #     (`httpx2>=2.0`); if pip never re-resolved, a cache hit would silently
    #     freeze the resolved transitive set and CI would stop seeing a new
    #     transitive release until something else touched pyproject.toml.
    #   * It also makes a stale cache self-correcting: a venv restored from an
    #     older key is repaired by pip in the same run rather than surviving
    #     until someone notices.
    #
    # WHAT IS INSIDE THE CACHE, AND WHY IT IS SAFE TO REUSE ACROSS JOBS.
    # The path is `.venv` and nothing else. Audit for this repository
    # (`find .venv -name '*.db' -o -name '*.sqlite*' -o -name 'evidence' -o
    # -name 'generated' -o -name '.env' -o -name '*.pem' -o -name '*.key'`)
    # returns nothing: the venv contains only interpreter scaffolding and
    # installed distributions. Every category the brief forbids is outside it —
    #     runtime/generated/**               generated evidence
    #     backend/tests/generated/**         mutation/contract results
    #     runtime/generated/m9-c*/**         certification output
    #     *.db / *.sqlite / dependency-reports   mutable state
    #     frontend/**, frontend/node_modules     Node tree (separate cache)
    # and no credential is written into a virtual environment by `pip install`
    # (the action's `pip config set` writes to ~/.config/pip, which is not
    # cached here).
    #
    # WHY UNTRUSTED CODE CANNOT POISON THIS CACHE. GitHub scopes a cache entry
    # to the ref that created it: a run for `refs/pull/<n>/merge` writes to
    # that merge ref and to no other, while runs on `main` read only entries
    # created on `main` (plus their own ref's). A fork pull request therefore
    # cannot seed an entry that a default-branch job restores. This is the
    # `actions/cache-poisoning` finding that api-contracts.yml already closed
    # by removing `pull-requests: write` and refusing to check out
    # `workflow_run.head_sha`; the cache scoping is the second half of that
    # same control, and it is a property of the platform rather than something
    # this file can weaken.
    #
    # KEY INPUTS, AND WHY EACH IS PRESENT
    #   runner.os                     wheels differ per OS.
    #   runner.arch                   the same release has different artifacts
    #                                 for X64 vs ARM64 runners.
    #   exact interpreter X.Y.Z       see the "Resolve Python toolchain identity"
    #                                 step above: `home` in pyvenv.cfg names the
    #                                 exact toolcache directory.
    #   hashFiles(pyproject.toml)     the single declared dependency authority
    #                                 (see pyproject.toml's own header). A change
    #                                 to any dependency or to the `all` extra
    #                                 changes this hash and therefore the key.
    #   hashFiles(requirements.lock)  the resolved-dependency snapshot. It is not
    #                                 read by `pip install -e ".[all]"`, so it
    #                                 does not change the dependency set, but it
    #                                 is included so the key cannot outlive a
    #                                 recorded resolution.
    #
    # No secret, token, repository-relative mutable path, or timestamp enters
    # the key. Nothing mutable is stored in the cached directory.
    - name: Cache repository virtual environment
      id: venv-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.pytool.outputs.full }}-${{ hashFiles('pyproject.toml', 'requirements.lock') }}
        # Prefix fallback across pyproject/lock revisions only. The OS, arch and
        # exact interpreter stay in the prefix, so a fallback can never hand
        # this job an environment built for a different platform — and pip
        # re-resolves it anyway, so the only cost of an older fallback is the
        # install time it would have paid regardless.
        restore-keys: |
          venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.pytool.outputs.full }}-

    - name: Create repository virtual environment
      if: steps.venv-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        rm -rf .venv
        python -m venv .venv

    # A cache restore is untrusted input to this job: it can be a partial
    # archive, an entry truncated by an interrupted upload, or an environment
    # left behind by a failed run. Every one of those would otherwise surface
    # as a confusing failure deep inside a verification task. The virtual
    # environment is validated here, and a failure rebuilds it from scratch in
    # the same job — the cache action then saves the rebuilt environment under
    # the same key, so a bad entry is repaired rather than inherited.
    - name: Validate repository virtual environment
      shell: bash
      run: |
        set -uo pipefail
        REBUILD=0
        REASON=""
        if [ ! -x .venv/bin/python ]; then
          REBUILD=1
          REASON="restored archive has no .venv/bin/python"
        elif ! .venv/bin/python --version >/dev/null 2>&1; then
          REBUILD=1
          REASON="restored interpreter is not executable"
        else
          GOT="$(.venv/bin/python -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])' 2>/dev/null || echo none)"
          if [ "$GOT" != "${{ steps.pytool.outputs.full }}" ]; then
            REBUILD=1
            REASON="restored interpreter is $GOT, runner provides ${{ steps.pytool.outputs.full }}"
          else
            PREFIX="$(.venv/bin/python -c 'import sys; print(sys.prefix)' 2>/dev/null || echo none)"
            if [ "$PREFIX" != "$GITHUB_WORKSPACE/.venv" ]; then
              REBUILD=1
              REASON="restored environment is bound to $PREFIX, not this workspace"
            elif ! .venv/bin/python -c 'import sys, runtime' >/dev/null 2>&1; then
              REBUILD=1
              REASON="restored environment cannot import the repository runtime package"
            fi
          fi
        fi
        if [ "$REBUILD" = "1" ]; then
          echo "::warning::Discarding the restored .venv and rebuilding: ${REASON}."
          rm -rf .venv
          python -m venv .venv
        else
          echo "Restored .venv validated: interpreter ${{ steps.pytool.outputs.full }}, prefix $GITHUB_WORKSPACE/.venv."
        fi

    - name: Configure pip
      shell: bash
      run: |
        python -m pip config set global.timeout 300
        python -m pip config set global.retries 10

    # Unconditional on purpose — see the cache comment above. pip is the
    # authority on the installed dependency set; the cache only removes the
    # unpacking cost.
    - name: Install ClariFin_OS
      shell: bash
      run: |
        set -euo pipefail
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/python -m pip install --timeout 300 --retries 10 -e ".[all]"
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

    - name: Verify environment
      shell: bash
      run: |
        set -euo pipefail
        .venv/bin/python --version
        .venv/bin/python -m pytest --version
        # Canary imports. Every tool the verification profiles invoke by module
        # name is imported here, so a restored environment that is missing one
        # fails in this step with a named cause instead of inside a 15-minute
        # suite. The list is exactly the executables pyproject.toml's
        # `verification` extra installs, plus the backend runtime imports the
        # backend profile needs.
        .venv/bin/python - <<'PY'
        import importlib
        modules = [
            "runtime", "pytest", "pytest_timeout", "xdist", "coverage",
            "ruff", "black", "mypy", "mutmut", "pip_audit", "hypothesis",
            "schemathesis", "fastapi", "uvicorn", "pydantic", "yaml", "httpx2",
            "pandas", "click", "jsonschema", "dateutil",
        ]
        missing = []
        for name in modules:
            try:
                importlib.import_module(name)
            except Exception as exc:  # noqa: BLE001 - report, do not mask
                missing.append(f"{name}: {type(exc).__name__}: {exc}")
        if missing:
            raise SystemExit("environment incomplete:\n  " + "\n  ".join(missing))
        print(f"canary imports OK ({len(modules)} modules)")
        PY
        .venv/bin/python -m runtime.verify env-check
        .venv/bin/python -m runtime.verify doctor
