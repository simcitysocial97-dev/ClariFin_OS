# .github/actions/download-runtime/action.yml
#
# Canonical Engineering Runtime artifact downloader.
#
# Rule 3 & 4 mirror the upload action: every artifact *download* in a workflow
# goes through this action, so naming, retention assumptions, and the
# merge strategy have exactly one implementation. Workflows declare WHAT they
# need; this action owns HOW it is fetched.
#
# Inputs:
#   name             Exact artifact name to download.
#   pattern          Artifact-name glob (mutually exclusive with `name`).
#   path             Destination directory.
#   merge-multiple   Flatten matching artifacts into one directory (default true).
#                    The mutation aggregate gate relies on this: every shard
#                    summary must land in a single reconciliation directory.

name: "Download Runtime Artifacts"
description: "Standardized artifact download with a single merge strategy."

inputs:
  name:
    description: "Exact artifact name to download"
    required: false
  pattern:
    description: "Artifact-name glob to download"
    required: false
  path:
    description: "Destination directory"
    required: true
  merge-multiple:
    description: "Flatten all matching artifacts into `path` (true|false)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    # M9-C72 — two defects fixed here.
    #
    # 1. VERSION. This was pinned to v7.0.1, which does not exist:
    #    actions/download-artifact publishes v7.0.0 then v8.0.0 — it never
    #    shipped a v7.0.1 patch. The sibling actions (checkout, upload-artifact)
    #    DO have v7.0.1, so a blanket bump left this one action unresolvable
    #    and the failure was silent until a job actually ran it:
    #        Unable to resolve action `actions/download-artifact@v7.0.1`,
    #        unable to find version `v7.0.1`
    #    Pinned to v7.0.0: the newest tag in the same major line the repo
    #    standardises on. See runtime/tests/test_m9_c72_action_pins.py, which
    #    fails CI if any action pin is not a published tag.
    #
    # 2. MUTUALLY EXCLUSIVE INPUTS. `name` and `pattern` are documented as
    #    mutually exclusive. Forwarding both (with `name` arriving as an empty
    #    string when a caller sets only `pattern`) selects the wrong lookup
    #    mode, so only the one the caller actually supplied is passed on.
    - name: Download ${{ inputs.name || inputs.pattern }}
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ inputs.name != '' && inputs.name || null }}
        pattern: ${{ inputs.pattern != '' && inputs.pattern || null }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
