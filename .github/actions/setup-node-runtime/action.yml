# .github/actions/setup-node-runtime/action.yml
# Canonical Node.js environment for the Engineering Runtime.
# Used by frontend / playwright workflows via the bootstrap.
# Rule 1 & 3: all Node setup lives here; no workflow inlines npm logic.

name: "Setup Node.js Runtime"
description: "Installs Node.js 24 LTS, configures npm, installs frontend dependencies with caching."

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "24"
  working-directory:
    description: "Directory containing package.json"
    required: false
    default: "frontend"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Configure npm
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        EXPECTED_NPM=$(node -p "require('./package.json').packageManager.split('@')[1]")
        ACTUAL_NPM=$(npm --version)
        if [ "$ACTUAL_NPM" != "$EXPECTED_NPM" ]; then
          echo "npm $EXPECTED_NPM is required by package.json; found $ACTUAL_NPM" >&2
          exit 1
        fi
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-retries 5
        npm config set fund false
        npm config set audit false

    - name: Install frontend dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
