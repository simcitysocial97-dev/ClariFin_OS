# .github/workflows/frontend.yml
#
# PURPOSE: Verify frontend and backend stay in sync
# WHAT IT CHECKS:
#   - OpenAPI schema is current
#   - Frontend TypeScript types match backend schemas
#   - No endpoints added/removed without frontend knowing

name: Frontend-Backend Sync

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/src/routers/**"
      - "frontend/src/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:

  openapi-sync:
    name: "OpenAPI Schema Sync"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          working-directory: "backend"

      # Program 7A: Generate cross-layer map once for shared use
      - name: Generate cross-layer map
        run: |
          python3 tools/generators/build_cross_layer_map.py

      - name: Upload cross-layer map
        uses: actions/upload-artifact@v4
        with:
          name: cross-layer-map
          path: runtime/generated/cross-layer-map.json
          retention-days: 5

      - name: Generate current OpenAPI schema
        working-directory: backend
        run: |
          cat > /tmp/gen_schema.py << 'PYEOF'
          import json
          import sys

          try:
              from api import app
          except ImportError:
              try:
                  from app.main import app
              except ImportError:
                  try:
                      from src.main import app
                  except ImportError:
                      print('ERROR: Could not import FastAPI app')
                      print('Adjust the import in frontend.yml')
                      sys.exit(1)

          schema = app.openapi()
          with open('tests/generated/openapi-current.json', 'w') as f:
              json.dump(schema, f, indent=2)

          print(f'Schema generated: {len(schema["paths"])} endpoints')
          PYEOF
          python /tmp/gen_schema.py

      - name: Compare with committed schema
        working-directory: backend
        run: |
          # Check if committed schema exists
          COMMITTED="tests/generated/api-map.json"
          CURRENT="tests/generated/openapi-current.json"
          
          if [ ! -f "$COMMITTED" ]; then
            echo "No committed API map found at $COMMITTED"
            echo "Creating initial baseline..."
            cp "$CURRENT" "$COMMITTED"
            echo "SCHEMA_CHANGED=false" >> "$GITHUB_ENV"
          else
            # Compare endpoint counts
            OLD_COUNT=$(python -c "import json; d=json.load(open('$COMMITTED')); print(len(d.get('paths', d)))")
            NEW_COUNT=$(python -c "import json; d=json.load(open('$CURRENT')); print(len(d.get('paths', {})))")
            
            if [ "$OLD_COUNT" != "$NEW_COUNT" ]; then
              echo "SCHEMA_CHANGED=true" >> "$GITHUB_ENV"
              echo "WARNING: Endpoint count changed: $OLD_COUNT → $NEW_COUNT"
            else
              echo "SCHEMA_CHANGED=false" >> "$GITHUB_ENV"
              echo "Endpoint count unchanged: $NEW_COUNT endpoints"
            fi
          fi

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema-${{ github.sha }}
          path: |
            backend/tests/generated/openapi-current.json
          retention-days: 30

      - name: Warn on schema change
        if: env.SCHEMA_CHANGED == 'true'
        run: |
          echo "::warning::API schema changed. Verify frontend TypeScript types are updated."

      # Job Summary
      - name: Job Summary
        if: always()
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        shell: bash

  schema-verification:
    name: "Schema & Mock Synchronization"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run DTO ↔ Zod schema audit
        working-directory: frontend
        run: npx tsx scripts/audit-schemas.ts

      - name: Run MSW mock ↔ Zod schema sync verification
        working-directory: frontend
        run: npx tsx scripts/verify-mock-sync.ts

      - name: Run capability contract tests
        working-directory: frontend
        run: npx vitest run lib/capabilities/__tests__/contract.test.ts

      # Job Summary
      - name: Job Summary
        if: always()
        run: |
          echo "## Schema & Mock Synchronization — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        shell: bash
