# .github/workflows/playwright.yml
#
# PURPOSE: End-to-end browser tests (Playwright).
# RESPONSIBILITY: Run `runtime/verify.py check` — the canonical verification command.
# Rule 1: no engineering logic in YAML. Rule 2: single responsibility. Rule 8:
# delegate to runtime/verify.py. Rule 9: append `verify.py status` summary.
#
# The playwright profile (run_playwright_tests.sh) owns build + browser tests.
# Browsers are provisioned by the setup-playwright action (environment only).

name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "frontend/**"
      - "e2e/**"
      - "runtime/**"
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - "frontend/**"
      - "e2e/**"
      - "runtime/**"
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: >-
          Regenerate the visual-regression baselines on this runner and upload
          them as an artifact. Baselines are rasterisation-specific, so they must
          be produced by a GitHub runner, never by a workstation.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Checkout only. This workflow reads the repository and uploads artifacts; it
  # never calls a pull-request API, so the previous `pull-requests: write` grant
  # was unearned privilege on a workflow that builds and runs arbitrary test code.
  contents: read

jobs:
  test:
    name: E2E Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - mobile-chrome
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Setup Node.js runtime
        uses: ./.github/actions/setup-node-runtime
        with:
          node-version: "24"
          working-directory: "frontend"

      - name: Install Playwright browsers
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: "frontend"
          browsers: chromium

      # M11 — deterministic E2E data.
      #
      # The webServer below starts uvicorn against the backend's DEFAULT
      # database, and nothing seeded it. Every surface the tests exercised was
      # therefore created by whichever specs happened to run first, so the data
      # a visual-regression spec observed depended on test ordering, retries and
      # worker scheduling.
      #
      # The visible symptom was a Cashflow Trend Y-axis tick appearing in some
      # runs and not others. `formatPaiseForChart` derives the tick set from
      # `domain={[0, 'dataMax + 100000']}`, so a varying dataMax moves the
      # ticks: one `₹72K` label, 1 740 differing pixels, and a red gate on a
      # chart that had not changed. Four other pages in the same run matched
      # their baselines exactly, which is what identified it as data variance
      # rather than a rendering or rasterisation change.
      #
      # `tools/e2e_seed.py` is reused here rather than introducing a second
      # seeding framework. It is the M11 E2E-seed deliverable, it was verified
      # byte-identical across two fresh runs, and `--reset` was fixed in M11 to
      # work without `--db` (it used to be a silent no-op).
      #
      # Seeding runs BEFORE the webServer starts, against an explicit path, so
      # the file the tests read is exactly the file this step wrote.
      - name: Seed deterministic E2E dataset
        shell: bash
        env:
          E2E_DB: ${{ github.workspace }}/backend/data/e2e-playwright.db
        run: |
          mkdir -p "$(dirname "$E2E_DB")"
          PYTHONPATH=backend .venv/bin/python tools/e2e_seed.py \
            --db "$E2E_DB" --reset

      - name: Run playwright verification (canonical check)
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
          CLARIFIN_PYTHON: ${{ github.workspace }}/.venv/bin/python
          PLAYWRIGHT_UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots && '1' || '' }}
          # The seeded database, so the webServer reads the file the step above
          # wrote rather than falling back to the backend default.
          FINANCE_DB_PATH: ${{ github.workspace }}/backend/data/e2e-playwright.db
        run: .venv/bin/python -m runtime.verify playwright

      # Visual baselines are only valid when produced by the same rendering
      # environment that will assert on them. This job IS that environment, so
      # the regenerated images are uploaded for download and commit rather than
      # being regenerated on a workstation.
      - name: Upload regenerated visual baselines
        if: ${{ inputs.update_snapshots == true }}
        uses: ./.github/actions/upload-runtime
        with:
          name: regenerated-visual-baselines-${{ matrix.project }}
          if-no-files-found: ignore
          path: |
            frontend/tests/e2e/specs/visual-regression.spec.ts-snapshots/
            frontend/test-results/

      - name: Upload shared artifact — cross-layer-map
        uses: ./.github/actions/upload-runtime
        with:
          name: cross-layer-map-${{ matrix.project }}
          path: runtime/generated/cross-layer-map.json
          retention-days: 14

      - name: Upload shared artifact — knowledge-index
        uses: ./.github/actions/upload-runtime
        with:
          name: knowledge-index-${{ matrix.project }}
          path: runtime/generated/knowledge-index.json
          retention-days: 14

      - name: Upload shared artifact — verification-cache
        uses: ./.github/actions/upload-runtime
        with:
          name: verification-cache-${{ matrix.project }}
          path: runtime/generated/verification-cache.json
          retention-days: 14

      - name: Upload shared artifact — engineering-history
        uses: ./.github/actions/upload-runtime
        with:
          name: engineering-history-${{ matrix.project }}
          path: runtime/generated/engineering-history.json
          retention-days: 14

      # M11. These two are the DIAGNOSTIC artifacts: the HTML report and the
      # per-test screenshots, including the `-actual` and `-diff` renders
      # Playwright writes for every failed visual comparison.
      #
      # `if: always()` is load-bearing, not decoration. Without it a failed
      # `Run Playwright test suite` step makes every later step skip by default,
      # so a red run uploaded NOTHING — the report and the diff images are
      # exactly what is needed to diagnose a red run, and they were being
      # discarded on the one occasion they mattered. `gh run download` on a
      # failed run returned "no valid artifacts found".
      #
      # This does not weaken the gate: the job still fails on the test step's
      # own exit code, and the uploads cannot mask or replace it.
      - name: Upload playwright report
        if: ${{ always() }}
        uses: ./.github/actions/upload-runtime
        with:
          name: playwright-report-${{ matrix.project }}
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload playwright evidence
        if: ${{ always() }}
        uses: ./.github/actions/upload-runtime
        with:
          name: playwright-evidence-${{ matrix.project }}
          path: frontend/test-results/
          retention-days: 30

      - name: Job Summary
        if: always()
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }} — ${{ matrix.project }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          .venv/bin/python -m runtime.verify status >> $GITHUB_STEP_SUMMARY
        shell: bash
