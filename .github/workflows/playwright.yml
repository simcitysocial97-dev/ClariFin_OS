name: Playwright Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Node.js
      - uses: ./.github/actions/setup-node-env
        with:
          working-directory: frontend
          node-version: "20"

      # Setup Python for backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # Install Playwright browsers
      - uses: ./.github/actions/setup-playwright
        with:
          working-directory: frontend
          browsers: chromium

      # Install backend dependencies
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      # Build frontend for production
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # Run Playwright tests
      - name: Run Playwright Tests
        working-directory: ./frontend
        run: npx playwright test

      # Upload test results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      # Upload test results directory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 7

      # Comment PR with results
      - name: Comment PR with Test Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'frontend/test-results/.setup-status.json';
            
            let status = 'Tests completed';
            if (fs.existsSync(path)) {
              const data = JSON.parse(fs.readFileSync(path, 'utf8'));
              status = `Backend: ${data.backendAvailable ? '✅' : '❌'} | Setup: ${data.setupTime}`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🧪 **Playwright Test Results**\n\n${status}\n\n[View Report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });

      # Job Summary
      - name: Job Summary
        if: always()
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        shell: bash