# .github/workflows/playwright.yml
#
# PURPOSE: End-to-end browser tests (Playwright).
# RESPONSIBILITY: Run `runtime/verify.py check` — the canonical verification command.
# Rule 1: no engineering logic in YAML. Rule 2: single responsibility. Rule 8:
# delegate to runtime/verify.py. Rule 9: append `verify.py status` summary.
#
# The playwright profile (run_playwright_tests.sh) owns build + browser tests.
# Browsers are provisioned by the setup-playwright action (environment only).

name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "frontend/**"
      - "e2e/**"
      - "runtime/**"
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - "frontend/**"
      - "e2e/**"
      - "runtime/**"
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: >-
          Regenerate the visual-regression baselines on this runner and upload
          them as an artifact. Baselines are rasterisation-specific, so they must
          be produced by a GitHub runner, never by a workstation.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Checkout only. This workflow reads the repository and uploads artifacts; it
  # never calls a pull-request API, so the previous `pull-requests: write` grant
  # was unearned privilege on a workflow that builds and runs arbitrary test code.
  contents: read

jobs:
  test:
    name: E2E Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - mobile-chrome
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Setup Node.js runtime
        uses: ./.github/actions/setup-node-runtime
        with:
          node-version: "24"
          working-directory: "frontend"

      - name: Install Playwright browsers
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: "frontend"
          browsers: chromium

      - name: Run playwright verification (canonical check)
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
          CLARIFIN_PYTHON: ${{ github.workspace }}/.venv/bin/python
          PLAYWRIGHT_UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots && '1' || '' }}
        run: .venv/bin/python -m runtime.verify playwright

      # Visual baselines are only valid when produced by the same rendering
      # environment that will assert on them. This job IS that environment, so
      # the regenerated images are uploaded for download and commit rather than
      # being regenerated on a workstation.
      - name: Upload regenerated visual baselines
        if: ${{ inputs.update_snapshots == true && matrix.project == 'chromium' }}
        uses: ./.github/actions/upload-runtime
        with:
          name: regenerated-visual-baselines
          if-no-files-found: ignore
          path: |
            frontend/tests/e2e/specs/visual-regression.spec.ts-snapshots/
            frontend/test-results/

      - name: Upload shared artifact — cross-layer-map
        uses: ./.github/actions/upload-runtime
        with:
          name: cross-layer-map-${{ matrix.project }}
          path: runtime/generated/cross-layer-map.json
          retention-days: 14

      - name: Upload shared artifact — knowledge-index
        uses: ./.github/actions/upload-runtime
        with:
          name: knowledge-index-${{ matrix.project }}
          path: runtime/generated/knowledge-index.json
          retention-days: 14

      - name: Upload shared artifact — verification-cache
        uses: ./.github/actions/upload-runtime
        with:
          name: verification-cache-${{ matrix.project }}
          path: runtime/generated/verification-cache.json
          retention-days: 14

      - name: Upload shared artifact — engineering-history
        uses: ./.github/actions/upload-runtime
        with:
          name: engineering-history-${{ matrix.project }}
          path: runtime/generated/engineering-history.json
          retention-days: 14

      - name: Upload playwright report
        uses: ./.github/actions/upload-runtime
        with:
          name: playwright-report-${{ matrix.project }}
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload playwright evidence
        uses: ./.github/actions/upload-runtime
        with:
          name: playwright-evidence-${{ matrix.project }}
          path: frontend/test-results/
          retention-days: 30

      - name: Job Summary
        if: always()
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }} — ${{ matrix.project }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          .venv/bin/python -m runtime.verify status >> $GITHUB_STEP_SUMMARY
        shell: bash
