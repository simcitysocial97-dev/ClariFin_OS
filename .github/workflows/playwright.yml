# .github/workflows/playwright.yml
#
# PURPOSE: End-to-end browser tests (Playwright).
# RESPONSIBILITY: Run `runtime/verify.py playwright` — the ONLY verification command.
# Rule 1: no engineering logic in YAML. Rule 2: single responsibility. Rule 8:
# delegate to runtime/verify.py. Rule 9: append `verify.py status` summary.
#
# The playwright profile (run_playwright_tests.sh) owns build + browser tests.
# Browsers are provisioned by the setup-playwright action (environment only).

name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "frontend/**"
      - "e2e/**"
      - "runtime/**"
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - "frontend/**"
      - "e2e/**"
      - "runtime/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Setup Node.js runtime
        uses: ./.github/actions/setup-node-runtime
        with:
          node-version: "20"
          working-directory: "frontend"

      - name: Install Playwright browsers
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: "frontend"
          browsers: chromium,firefox,webkit

      - name: Run playwright verification
        run: python runtime/verify.py playwright

      - name: Upload shared artifact — cross-layer-map
        uses: ./.github/actions/upload-runtime
        with:
          name: cross-layer-map
          path: runtime/generated/cross-layer-map.json
          retention-days: 14

      - name: Upload shared artifact — knowledge-index
        uses: ./.github/actions/upload-runtime
        with:
          name: knowledge-index
          path: runtime/generated/knowledge-index.json
          retention-days: 14

      - name: Upload shared artifact — verification-cache
        uses: ./.github/actions/upload-runtime
        with:
          name: verification-cache
          path: runtime/generated/verification-cache.json
          retention-days: 14

      - name: Upload shared artifact — engineering-history
        uses: ./.github/actions/upload-runtime
        with:
          name: engineering-history
          path: runtime/generated/engineering-history.json
          retention-days: 14

      - name: Upload playwright report
        uses: ./.github/actions/upload-runtime
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload playwright evidence
        uses: ./.github/actions/upload-runtime
        with:
          name: playwright-evidence
          path: frontend/test-results/
          retention-days: 30

      - name: Job Summary
        if: always()
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python runtime/verify.py status >> $GITHUB_STEP_SUMMARY
        shell: bash
