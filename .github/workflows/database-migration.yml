name: Database Migration Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/src/db/**'
      - 'backend/src/migrations/**'
      - '.github/workflows/database-migration.yml'
  pull_request:
    branches: [ main ]

jobs:
  migration-check:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clarinfin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install psycopg2-binary

    - name: Run schema validation
      run: |
        cd backend
        python -c "
        import os
        os.environ['DATABASE_URL'] = 'postgresql://postgres:postgres@localhost:5432/clarinfin_test'
        from src.db_schema import validate_schema
        validate_schema()
        "
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clarinfin_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: clarinfin_test

    - name: Check migration idempotency
      run: |
        cd backend
        python -c "
        import os
        os.environ['DATABASE_URL'] = 'postgresql://postgres:postgres@localhost:5432/clarinfin_test'
        # Test that schema is idempotent (can be applied multiple times)
        from src.db_schema import apply_schema
        apply_schema()
        apply_schema()  # Should not fail
        print('Migration idempotency check passed')
        "
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clarinfin_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: clarinfin_test

    - name: Run database-related tests
      run: |
        cd backend
        pip install pytest pytest-cov
        pytest tests/test_db_schema.py -v --tb=short
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clarinfin_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: clarinfin_test