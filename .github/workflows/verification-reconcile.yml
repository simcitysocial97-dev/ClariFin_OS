name: Verification Reconcile

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "runtime/**"
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reconcile-gate:
    name: Plan / Execute / Reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Setup Node.js runtime
        uses: ./.github/actions/setup-node-runtime
        with:
          node-version: "24"
          working-directory: "frontend"

      # The planner can schedule run_playwright_tests.sh when the boundary
      # touches frontend E2E. That script's ED6 pre-flight check exits 1 when the
      # required browser revision is absent, so without this step the task failed
      # in 0.79 s before running anything. Reuses the same composite the
      # Playwright workflow uses, including its browser cache.
      - name: Install Playwright browsers
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: "frontend"
          browsers: chromium

      - name: Run canonical verification
        env:
          VERIFICATION_BASE_REF: ${{ github.base_ref || github.event.before }}
          VERIFICATION_HEAD_REF: ${{ github.sha }}
        run: .venv/bin/python -m runtime.verify check
        shell: bash

      - name: Upload reconciliation artifacts
        if: always()
        uses: ./.github/actions/upload-runtime
        with:
          name: reconciliation-report
          path: |
            runtime/generated/evidence/
            runtime/generated/engineering-history.json
            runtime/generated/verification-cache.json
          retention-days: 14

      - name: Job Summary
        if: always()
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          .venv/bin/python -m runtime.verify doctor >> $GITHUB_STEP_SUMMARY
        shell: bash
