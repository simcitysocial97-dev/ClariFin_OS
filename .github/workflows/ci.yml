# SUPERSEDED WORKFLOW — DO NOT ENABLE
# This workflow has been superseded by:
#   quality.yml    (linting, unit tests)
#   backend.yml    (full backend suite)
#   frontend-build.yml (frontend build)
#   playwright.yml     (E2E tests)
# Triggers are set to workflow_dispatch only.
# Kept for historical reference.
# Safe to delete after 2025-12-31.

name: CI

# SUPERSEDED by quality.yml and backend.yml (Phase 0 CI infrastructure)
# Keeping for reference — disabled automatic triggers to prevent duplicate runs
on:
  workflow_dispatch:    # Manual only until Phase 1 consolidation

# on:
#   push:
#     branches: [main, "feat/*"]
#   pull_request:
#     branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── STAGE 1: Static Analysis ─────────────────────────────────────────────
  frontend-static:
    name: Frontend — TypeScript + ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 5
          npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  backend-static:
    name: Backend — Ruff + Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install ruff mypy -r backend/requirements.txt

      - name: Ruff lint
        run: ruff check backend/src/

      - name: Mypy type check
        run: mypy backend/src/api.py --ignore-missing-imports

  # ─── STAGE 2: Unit + Integration Tests ────────────────────────────────────
  frontend-tests:
    name: Frontend — Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [frontend-static]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 5
          npm ci

      - name: Run Vitest
        run: npm test -- --reporter=verbose

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: frontend/coverage/
          retention-days: 7

  backend-tests:
    name: Backend — Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-static]

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install pytest pytest-cov -r backend/requirements.txt

      - name: Run pytest
        run: pytest backend/tests/ -v --tb=short

  # ─── STAGE 3: Build Verification ──────────────────────────────────────────
  build:
    name: Frontend — Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-tests]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 5
          npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: frontend/.next
          retention-days: 1

  # ─── STAGE 4: E2E Tests ────────────────────────────────────────────────────
  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, backend-tests]

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 5
          npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Start backend
        run: |
          cd backend/src
          python api.py &
          echo "Waiting for backend..."
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'
          echo "Backend ready"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build and start frontend
        working-directory: frontend
        run: |
          npm run build
          npm start &
          echo "Waiting for frontend..."
          timeout 30 bash -c 'until curl -sf http://localhost:3000; do sleep 1; done'
          echo "Frontend ready"
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test --reporter=html
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ─── STAGE 5: Security Scanning ───────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend dependency audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
        continue-on-error: true

      - name: Secret detection
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified
