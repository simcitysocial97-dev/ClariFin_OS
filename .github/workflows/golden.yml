# .github/workflows/golden.yml
#
# PURPOSE: Golden dataset regression tests (nightly).
# RESPONSIBILITY: Run `runtime/verify.py golden` — the ONLY verification command.
# Rule 1: no engineering logic in YAML. Rule 2: single responsibility. Rule 8:
# delegate to runtime/verify.py. Rule 9: append `verify.py status` summary.
# Concurrency: never cancel (golden is in the Rule 6 exception list).

name: Golden Dataset Regression

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Specific dataset (or 'all')"
        required: false
        default: "all"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  golden:
    name: Golden Dataset Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Run golden verification
        run: python runtime/verify.py golden

      - name: Upload shared artifact — cross-layer-map
        uses: ./.github/actions/upload-runtime
        with:
          name: cross-layer-map
          path: runtime/generated/cross-layer-map.json
          retention-days: 14

      - name: Upload shared artifact — knowledge-index
        uses: ./.github/actions/upload-runtime
        with:
          name: knowledge-index
          path: runtime/generated/knowledge-index.json
          retention-days: 14

      - name: Upload shared artifact — verification-cache
        uses: ./.github/actions/upload-runtime
        with:
          name: verification-cache
          path: runtime/generated/verification-cache.json
          retention-days: 14

      - name: Upload shared artifact — engineering-history
        uses: ./.github/actions/upload-runtime
        with:
          name: engineering-history
          path: runtime/generated/engineering-history.json
          retention-days: 14

      - name: Upload golden report
        uses: ./.github/actions/upload-runtime
        with:
          name: golden-report   
          path: runtime/generated/verification-report.md
          retention-days: 90

      - name: Upload golden evidence
        uses: ./.github/actions/upload-runtime
        with:
          name: golden-evidence
          path: backend/tests/generated/
          retention-days: 30

      - name: Job Summary
        if: always()
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python runtime/verify.py status >> $GITHUB_STEP_SUMMARY
        shell: bash
