# .github/workflows/api-contracts.yml
#
# PURPOSE: M9-C27 — API Contract Integrity & Drift-Proofing gate.
# RESPONSIBILITY: Run the canonical api-contracts capability.
#   A contract break fails here (cheaply, ~seconds) instead of after
#   1,392 Playwright instances. This is a precondition for E2E.
# Rule 1: no engineering logic in YAML. Rule 8: delegate to runtime/verify.py.
# Rule 9: append verify.py status summary.

name: API Contract Integrity

on:
  push:
    branches:
      - "main"      # Scoped to the integration branches, not "**". A feature branch
      # push and its pull_request event are the same commit, so "**" made
      # this workflow run twice per PR and report twice under the same name.
      # Feature branches now run via pull_request only; main/develop still run
      # via push. Same convention as playwright.yml and security-codeql.yml.
      - "develop"
    paths:
      - "backend/**"
      - "frontend/**"
      - "runtime/**"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "frontend/**"
      - "runtime/**"
  workflow_dispatch:
  # The `workflow_run` trigger re-checks the contract when the E2E suite fails,
  # because a contract break is the cheapest explanation for it.
  #
  # It also made this workflow privileged: `actions/untrusted-checkout` (critical)
  # flagged checking out `github.event.workflow_run.head_sha`, which is attacker-
  # controlled whenever a fork opens a pull request, in a job holding a token
  # with write scope. Nothing here writes — the gate only runs a check and
  # uploads evidence — so the write scope is removed rather than the trigger.
  # With `contents: read` only, the checkout can no longer reach anything the
  # untrusted code could escalate through, and the finding is closed by removing
  # the privilege rather than by removing the safety net.
  #
  # The checkout deliberately does NOT use `github.event.workflow_run.head_sha`.
  # For a `workflow_run` event `github.sha` is already the default branch's head,
  # which is the trusted ref this gate is meant to re-check; `head_sha` is the
  # commit the untrusted run executed, and a fork's pull request controls it.
  # Checking it out let untrusted code seed the Actions cache that
  # `bootstrap-runtime` restores on later default-branch runs
  # (`actions/cache-poisoning/poisonable-step`, high), which the removal of
  # `pull-requests: write` did not address — the write scope was the privilege
  # leak, the checkout was the cache-poisoning path, and they are separate
  # findings with separate fixes.
  workflow_run:
    workflows: ["Playwright Tests"]
    types:
      - failed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-contracts:
    name: API Contract Integrity Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Run API contract integrity gate (canonical check)
        run: .venv/bin/python -m runtime.verify contracts

      - name: Upload contract evidence
        uses: ./.github/actions/upload-runtime
        with:
          name: api-contract-evidence
          path: |
            runtime/generated/evidence/summary.json
            runtime/generated/evidence/summary.md
            backend/tests/generated/contract-coverage.json
          retention-days: 30

      - name: Job Summary
        if: always()
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          .venv/bin/python -m runtime.verify status >> $GITHUB_STEP_SUMMARY
