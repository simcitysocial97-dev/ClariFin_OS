# SUPERSEDED WORKFLOW — DO NOT ENABLE
# This workflow has been superseded by:
#   backend.yml (full backend suite)
#   frontend-build.yml (frontend build)
# Triggers are set to workflow_dispatch only.
# Safe to delete after 2025-12-31.

name: Full Stack Validation

# SUPERSEDED by backend.yml (Phase 0 CI infrastructure)
# Keeping for reference — disabled automatic triggers to prevent duplicate runs
on:
  workflow_dispatch:    # Manual only

concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - run: pip install -r requirements.txt
    - run: pytest tests/ -v

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
    - run: npm ci
    - run: npm run build

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
    - run: echo "✅ All validation checks passed!"