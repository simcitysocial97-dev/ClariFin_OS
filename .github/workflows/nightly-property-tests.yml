name: Nightly Property Tests

on:
  schedule:
    - cron: "0 2 * * *"  # Run at 2 AM UTC every day
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: nightly-property-${{ github.ref }}
  cancel-in-progress: false

jobs:
  property-tests:
    name: Backend — Property Tests (Nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          working-directory: "backend"

      - name: Run property tests with nightly profile
        working-directory: backend
        run: |
          python -m runtime.ci_targets --property > ci-property-targets.txt
          xargs pytest < ci-property-targets.txt -v --tb=short --hypothesis-profile=nightly

      - name: Upload property test results
        uses: ./.github/actions/upload-test-artifacts
        with:
          name: property-test-results
          path: backend/tests/generated/
          retention-days: 7

      - name: Job Summary
        if: always()
        run: |
          echo "## Property Tests (Nightly) — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        shell: bash

  performance-tests:
    name: Backend — Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          working-directory: "backend"

      - name: Run performance tests
        working-directory: backend
        run: |
          pytest tests/ -v --tb=short -m performance -k "performance" || true

      - name: Upload performance results
        uses: ./.github/actions/upload-test-artifacts
        with:
          name: performance-test-results
          path: backend/tests/generated/
          retention-days: 7

      - name: Job Summary
        if: always()
        run: |
          echo "## Performance Tests (Nightly) — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        shell: bash