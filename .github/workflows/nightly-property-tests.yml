name: Nightly Property Tests

on:
  schedule:
    - cron: "0 2 * * *"  # Run at 2 AM UTC every day
  workflow_dispatch:  # Allow manual trigger

jobs:
  property-tests:
    name: Backend — Property Tests (Nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run property tests with nightly profile
        run: |
          cd backend
          pytest tests/properties/ -v --tb=short -m property --hypothesis-profile=nightly

      - name: Upload property test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property-test-results
          path: backend/property-results/
          retention-days: 7

  performance-tests:
    name: Backend — Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run performance tests
        run: |
          cd backend
          pytest tests/ -v --tb=short -m performance -k "performance" || true

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: backend/performance-results/
          retention-days: 7
