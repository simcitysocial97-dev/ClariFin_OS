# .github/workflows/mutation.yml
#
# PURPOSE: Mutation testing — finds gaps in test effectiveness (nightly).
# RESPONSIBILITY: Run `python -m runtime.verify mutation` — the ONLY verification command.
# Rule 1: no engineering logic in YAML. Rule 2: single responsibility. Rule 8:
# delegate to python -m runtime.verify. Rule 9: append `runtime.verify status` summary.
# Canonical entrypoint: runtime/verify.py (python -m runtime.verify <profile>)
# Concurrency: never cancel (mutation is in the Rule 6 exception list).
#
# Two jobs:
#   mutation-smoke — bounded infrastructure health check (seconds). MUST pass
#                    before the expensive full campaign. Proves the mutation
#                    pipeline can distinguish killed/survived/no-test.
#   mutation       — authoritative full campaign (80% gate). needs: mutation-smoke.
# Both delegate to python -m runtime.verify; no mutation logic lives in YAML.

name: Mutation Testing

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      target-path:
        description: "Path to mutate (e.g. src/engines/loan_engine.py)"
        required: false
        default: ""
      engine-name:
        description: "Specific engine name (e.g. loan, credit_card)"
        required: false
        default: "all"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutation-smoke:
    name: Mutation Smoke (infra health)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Verify canonical environment
        run: python -m runtime.verify env-check

      - name: Run bounded mutation smoke
        run: python -m runtime.verify mutation --smoke

  mutation:
    name: Mutation Testing (authoritative)
    needs: mutation-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Verify canonical environment
        run: python -m runtime.verify env-check

      - name: Run mutation testing
        run: python -m runtime.verify mutation

      - name: Upload shared artifact — cross-layer-map
        uses: ./.github/actions/upload-runtime
        with:
          name: cross-layer-map
          path: runtime/generated/cross-layer-map.json
          retention-days: 14

      - name: Upload shared artifact — knowledge-index
        uses: ./.github/actions/upload-runtime
        with:
          name: knowledge-index
          path: runtime/generated/knowledge-index.json
          retention-days: 14

      - name: Upload shared artifact — verification-cache
        uses: ./.github/actions/upload-runtime
        with:
          name: verification-cache
          path: runtime/generated/verification-cache.json
          retention-days: 14

      - name: Upload shared artifact — engineering-history
        uses: ./.github/actions/upload-runtime
        with:
          name: engineering-history
          path: runtime/generated/engineering-history.json
          retention-days: 14

      - name: Upload mutation report
        uses: ./.github/actions/upload-runtime
        with:
          name: mutation-report
          path: |
            backend/tests/generated/mutation/mutation-report.md
            backend/tests/generated/mutation/mutation-summary.json
          retention-days: 90

      - name: Upload mutation evidence
        uses: ./.github/actions/upload-runtime
        with:
          name: mutation-evidence
          path: backend/tests/generated/mutation/
          retention-days: 30

      - name: Upload coverage evidence (C55)
        uses: ./.github/actions/upload-runtime
        with:
          name: coverage-evidence
          path: runtime/generated/m9-c47/coverage/
          retention-days: 90
          if-condition: always()
          if-no-files-found: warn

      - name: Classify mutation result
        id: mutation
        if: always()
        run: |
          SUMMARY="backend/tests/generated/mutation/mutation-summary.json"
          if [ ! -f "$SUMMARY" ]; then
            echo "mutation_execution_status=INFRASTRUCTURE_FAILURE" >> $GITHUB_OUTPUT
            echo "mutation_evaluated=false" >> $GITHUB_OUTPUT
            echo "mutation_score=N/A" >> $GITHUB_OUTPUT
            echo "mutation_killed=0" >> $GITHUB_OUTPUT
            echo "mutation_survived=0" >> $GITHUB_OUTPUT
            echo "mutation_threshold=80" >> $GITHUB_OUTPUT
            echo "mutation_exit_code=1" >> $GITHUB_OUTPUT
            echo "mutation_reason=mutation-summary.json was not produced (execution did not complete)" >> $GITHUB_OUTPUT
            exit 0
          fi
          EXEC=$(jq -r '.execution_status' "$SUMMARY")
          CLSS=$(jq -r '.classification_status' "$SUMMARY")
          EVID=$(jq -r '.evidence_complete' "$SUMMARY")
          SCORE=$(jq -r '.mutation_score' "$SUMMARY")
          KILLED=$(jq -r '.killed' "$SUMMARY")
          SURVIVED=$(jq -r '.survived' "$SUMMARY")
          THRESH=$(jq -r '.threshold_percent' "$SUMMARY")
          echo "mutation_execution_status=$EXEC" >> $GITHUB_OUTPUT
          echo "mutation_killed=$KILLED" >> $GITHUB_OUTPUT
          echo "mutation_survived=$SURVIVED" >> $GITHUB_OUTPUT
          echo "mutation_threshold=$THRESH" >> $GITHUB_OUTPUT
          if [ "$EXEC" = "PASS" ] && [ "$CLSS" = "PASS" ] && [ "$EVID" = "true" ]; then
            echo "mutation_evaluated=true" >> $GITHUB_OUTPUT
            echo "mutation_score=$SCORE" >> $GITHUB_OUTPUT
            if [ "$SCORE" != "null" ] && [ "$(echo "$SCORE >= $THRESH" | bc)" -eq 1 ]; then
              echo "mutation_exit_code=0" >> $GITHUB_OUTPUT
              echo "mutation_reason=Mutation score meets threshold" >> $GITHUB_OUTPUT
            else
              echo "mutation_exit_code=2" >> $GITHUB_OUTPUT
              echo "mutation_reason=Mutation score below threshold" >> $GITHUB_OUTPUT
            fi
          else
            # Gate A or B failed: mutation was NOT evaluated. Never a 0% score.
            echo "mutation_evaluated=false" >> $GITHUB_OUTPUT
            echo "mutation_score=N/A" >> $GITHUB_OUTPUT
            echo "mutation_exit_code=1" >> $GITHUB_OUTPUT
            echo "mutation_reason=Mutation testing was not evaluated — execution/evidence integrity failed (no score computed)" >> $GITHUB_OUTPUT
          fi

      - name: Job Summary
        if: always()
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Mutation Testing Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric       | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Score        | ${{ steps.mutation.outputs.mutation_score }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Evaluated    | ${{ steps.mutation.outputs.mutation_evaluated }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Killed       | ${{ steps.mutation.outputs.mutation_killed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Survived     | ${{ steps.mutation.outputs.mutation_survived }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Threshold    | ${{ steps.mutation.outputs.mutation_threshold }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Exec status  | ${{ steps.mutation.outputs.mutation_execution_status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.mutation.outputs.mutation_evaluated }}" = "true" ] && [ "${{ steps.mutation.outputs.mutation_exit_code }}" = "0" ]; then
            echo "✅ Mutation score meets threshold" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.mutation.outputs.mutation_evaluated }}" = "true" ]; then
            echo "❌ Mutation score below threshold" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ MUTATION NOT EVALUATED — ${{ steps.mutation.outputs.mutation_reason }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No mutation score was computed. This is an infrastructure/evidence" >> $GITHUB_STEP_SUMMARY
            echo "failure, NOT a 0% quality result." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          python -m runtime.verify status >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Fail if mutation gate not satisfied
        if: always()
        run: |
          CODE="${{ steps.mutation.outputs.mutation_exit_code }}"
          if [ "$CODE" = "0" ]; then
            echo "✅ Mutation quality gate passed"
            exit 0
          elif [ "${{ steps.mutation.outputs.mutation_evaluated }}" = "true" ]; then
            echo "❌ Mutation score below threshold (${{ steps.mutation.outputs.mutation_score }}% < ${{ steps.mutation.outputs.mutation_threshold }}%)"
            exit 2
          else
            echo "❌ ${{ steps.mutation.outputs.mutation_reason }}"
            exit 1
          fi
