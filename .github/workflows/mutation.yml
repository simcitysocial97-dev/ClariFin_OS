# .github/workflows/mutation.yml
#
# PURPOSE: Mutation testing — measures test effectiveness and gates quality.
# RESPONSIBILITY: delegate to the canonical verification runtime. Rule 1: no
# engineering logic in YAML. Rule 2: single responsibility. Rule 8: delegate to
# `runtime.verify`. Rule 9: append `runtime.verify doctor` summary.
#
# M9-C71 — SHARDED AUTHORITATIVE CAMPAIGN
# --------------------------------------
# The campaign is sharded by certified component instead of running as one
# mutmut process. The previous single-process full campaign could not finish
# inside any job window (GitHub run 36233136018 was cancelled after 91m45s with
# zero evidence), which made the quality gate permanently unsatisfiable.
#
# Three jobs:
#   mutation-smoke     — bounded infrastructure health check. MUST pass before
#                        any campaign runs. Proves the pipeline can distinguish
#                        killed/survived/no-test.
#   mutation-plan      — emits the shard matrix from ENGINE_SELECTION so the job
#                        graph and the selection contract cannot drift apart.
#   mutation-shard[]   — one bounded, independently measured shard per
#                        certified component.
#   mutation-aggregate — the single authoritative gate. Requires every planned
#                        shard to be present, executed, and to have a non-empty
#                        measured population, then enforces the campaign
#                        threshold across the combined population.
#
# No threshold is lowered, no test is suppressed, no shard is silently skipped:
# a missing or empty shard is an explicit aggregate failure.
#
# M9-C72 — EVIDENCE-FIRST, INCREMENTAL
# ------------------------------------
# The 90-minute per-shard timeout was never the problem: the slowest shard
# measures in 11.5 min locally and 8m07s in CI, so the campaign used 12% of its
# budget. The failure was a three-minute evidence-TRANSPORT fault that forced a
# full re-measurement to recover, which is why run 36374920553 spent 26 jobs and
# an unbounded debugging session on `Unable to resolve action
# actions/download-artifact@v7.0.1` — a tag that does not exist.
#
# Measurement and reconciliation are now separate concerns:
#
#   mode=measure      every planned shard is measured, then reconciled
#   mode=incremental  only shards a diff can affect are measured; the rest come
#                     from the reuse registry and are FINGERPRINT-VALIDATED.
#                     A stale entry is an explicit aggregate FAILURE, never a
#                     silent pass on evidence that no longer describes the code.
#   mode=replay       no measurement at all: reconcile a prior run's evidence.
#                     This is the REPAIR path, and it costs a re-download.
#
# Typical cost: measure ~15 min / 26 shards, incremental ~2 min / 0-2 shards,
# replay ~3 min / 0 shards.

name: Mutation Testing

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      engine-name:
        description: "Specific engine name (e.g. loan, credit_card), or all"
        required: false
        default: "all"
      mode:
        description: >-
          measure = run the campaign for the planned shards;
          incremental = only shards a diff can affect;
          replay = re-run NO measurement, reconcile evidence from a prior run
        required: false
        default: "measure"
        type: choice
        options: [measure, incremental, replay]
      base-ref:
        description: "Diff base for incremental mode (default: previous push)"
        required: false
        default: ""
      evidence-run-id:
        description: "Run whose shard artifacts replay should reconcile (replay mode)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # M9-C72: bracket access is REQUIRED for hyphenated input names. Dotted
  # access (`inputs.engine-name`) parses as subtraction and silently yields
  # empty — which was invisible here only because empty equals the default.
  MUTATION_COMPONENT: ${{ inputs['engine-name'] || 'all' }}
  MUTATION_MODE: ${{ inputs.mode || 'measure' }}

jobs:
  mutation-smoke:
    name: Mutation Smoke (infra health)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Setup Node.js runtime
        uses: ./.github/actions/setup-node-runtime
        with:
          node-version: "24"
          working-directory: "frontend"

      - name: Verify canonical environment
        run: .venv/bin/python -m runtime.verify doctor

      - name: Run bounded mutation smoke (canonical check)
        run: .venv/bin/python -m runtime.verify mutation --smoke

      - name: Upload mutation smoke evidence
        uses: ./.github/actions/upload-runtime
        with:
          name: mutation-smoke-evidence
          path: |
            backend/tests/generated/mutation/local-smoke/
            backend/tests/generated/mutation/mutation-logs/
            backend/tests/generated/mutation/mutmut-toolchain-contract.json
          retention-days: 30

      - name: Job Summary
        if: always()
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }} — smoke" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          .venv/bin/python -m runtime.verify doctor >> $GITHUB_STEP_SUMMARY
        shell: bash

  mutation-plan:
    name: Mutation Campaign Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every value another job reads through `needs.<job>.outputs.<name>` must be
    # declared here. An undeclared step output evaluates to the empty string, and
    # `timeout-minutes: ''` is not a number — GitHub rejects the job definition
    # and creates ZERO shard jobs. The signature was a run whose plan and smoke
    # jobs both succeeded, whose shard jobs did not exist at all, and whose
    # aggregate gate skipped: `failure` with nothing to fix. `timeout` was read by
    # the shard job's `timeout-minutes:` but never declared, which is exactly that.
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      components: ${{ steps.plan.outputs.components }}
      count: ${{ steps.plan.outputs.count }}
      total: ${{ steps.plan.outputs.total }}
      diff_safe: ${{ steps.plan.outputs.diff_safe }}
      timeout: ${{ steps.plan.outputs.timeout }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Setup Node.js runtime
        uses: ./.github/actions/setup-node-runtime
        with:
          node-version: "24"
          working-directory: "frontend"

      - name: Emit canonical shard matrix
        id: plan
        shell: bash
        run: |
          # M9-C72 — incremental mode measures only what a diff can affect.
          #
          # The plan CLI is the single source of truth for shard selection, so
          # the diff logic lives there and not in YAML. A diff that cannot be
          # computed makes the CLI fall back to the FULL plan rather than an
          # empty one, so a shallow clone or a bad ref can never silently skip
          # the campaign.
          BASE="${{ inputs['base-ref'] }}"
          if [ "$MUTATION_MODE" = "incremental" ]; then
            if [ -z "$BASE" ]; then
              BASE="${{ github.event.before }}"
            fi
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "No usable diff base; falling back to the full plan." >> $GITHUB_STEP_SUMMARY
              MATRIX="$(.venv/bin/python -m runtime.verify mutation-plan)"
            else
              MATRIX="$(.venv/bin/python -m runtime.verify mutation-plan --affected-from "$BASE")"
            fi
          else
            MATRIX="$(.venv/bin/python -m runtime.verify mutation-plan)"
          fi
          # `fromJson` is handed this document verbatim, and GitHub reads every
          # top-level key other than `include`/`exclude` as a matrix DIMENSION
          # whose value must be a LIST. The plan document also carries
          # `shard_count`, `total_shards`, `diff_safe` and
          # `recommended_timeout_minutes` for the summary below, and handing
          # those over made the evaluator reject the matrix before a runner was
          # ever involved ("the matrix must define at least one vector"), so the
          # shard job was never created and the campaign measured nothing. The
          # matrix therefore carries `include` and nothing else; the summary
          # still reads the full plan.
          MATRIX_JSON="$(jq -c '{include: .include}' <<< "$MATRIX")"
          {
            echo "matrix<<MUTMATRIX_EOF"
            echo "$MATRIX_JSON"
            echo "MUTMATRIX_EOF"
            echo "components=$(jq -r '[.include[].component] | join(" ")' <<< "$MATRIX")"
            echo "count=$(jq -r '.include | length' <<< "$MATRIX")"
            echo "total=$(jq -r '.total_shards' <<< "$MATRIX")"
            echo "diff_safe=$(jq -r '.diff_safe' <<< "$MATRIX")"
            echo "timeout=$(jq -r '.recommended_timeout_minutes' <<< "$MATRIX")"
            echo "mode=$MUTATION_MODE"
          } >> $GITHUB_OUTPUT
          {
            echo "## ${{ github.workflow }} — Run #${{ github.run_number }} — plan"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Mode | $MUTATION_MODE |"
            echo "| Requested scope | $MUTATION_COMPONENT |"
            echo "| Shards selected | $(jq -r '.include | length' <<< "$MATRIX") |"
            echo "| Shards in full plan | $(jq -r '.total_shards' <<< "$MATRIX") |"
            echo "| Diff safely computed | $(jq -r '.diff_safe' <<< "$MATRIX") |"
            echo "| Per-shard timeout | $(jq -r '.recommended_timeout_minutes' <<< "$MATRIX") min |"
            echo ""
            echo "| Shard | Component | Selected because |"
            echo "|-------|-----------|------------------|"
            jq -r '.include[] | "| \(.shard) | \(.component) | \(.reasons | join(", ") // "full campaign") |"' <<< "$MATRIX" >> $GITHUB_STEP_SUMMARY
            echo ""
          } >> $GITHUB_STEP_SUMMARY

  mutation:
    name: Mutation Shard (${{ matrix.shard }})
    needs: [mutation-smoke, mutation-plan]
    # Replay mode must SKIP measurement explicitly. Leaving the job merely
    # un-runnable produced a run whose conclusion was `failure` while every job
    # reported success: the aggregate gate's `needs: [mutation]` had no job to
    # resolve against, and GitHub scored the run as failed with nothing to fix.
    #
    # The mode arrives as a job OUTPUT, not as `env`: the `env` context is not
    # available in a job-level `if:`, and using it makes the workflow file
    # unparseable ("Unrecognized named-value: 'env'"). `needs.<job>.outputs` is
    # available there, so the plan job is the right place to publish it.
    #
    # `count != '0'` rather than `matrix != '[]'`: an incremental campaign that
    # selects no shard is a real, legitimate outcome, and the plan already
    # publishes the selected-shard count for exactly that decision. Comparing
    # the matrix document against a two-character literal was a guess at a
    # serialisation that the producer is free to change.
    if: >-
      needs.mutation-plan.outputs.mode != 'replay'
      && needs.mutation-plan.result == 'success'
      && needs.mutation-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    # M9-C72 — derived from measured p95 x2 by mutation-plan, not a flat 90.
    # With the slowest shard measured at 693 s this lands at 21 min, so a
    # pathological shard fails visibly instead of holding a parallel slot for
    # 90 minutes and reporting an ambiguous timeout. The plan job always emits
    # this output, including when the diff lookup fails.
    timeout-minutes: ${{ needs.mutation-plan.outputs.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJson(needs.mutation-plan.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Setup Node.js runtime
        uses: ./.github/actions/setup-node-runtime
        with:
          node-version: "24"
          working-directory: "frontend"

      - name: Verify canonical environment
        run: .venv/bin/python -m runtime.verify doctor

      - name: Measure shard mutation (canonical check)
        run: .venv/bin/python -m runtime.verify mutation --shard "${{ matrix.shard }}"

      - name: Upload shard summary
        if: always()
        uses: ./.github/actions/upload-runtime
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: |
            backend/tests/generated/mutation/mutation-summary-${{ matrix.shard }}.json
            backend/tests/generated/mutation/measurement-truth-${{ matrix.shard }}.json
            backend/tests/generated/mutation/mutation-survivor-intel-${{ matrix.shard }}.json
            backend/tests/generated/mutation/mutation-survivors-${{ matrix.shard }}.json
            backend/tests/generated/mutation/mutmut-toolchain-contract.json
            backend/tests/generated/mutation/mutation-logs/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload coverage evidence (C55)
        if: always()
        uses: ./.github/actions/upload-runtime
        with:
          name: mutation-coverage-evidence-${{ matrix.shard }}
          path: runtime/generated/m9-c47/coverage/
          retention-days: 90
          if-no-files-found: warn

      # M9-C72: publish this shard's fingerprinted verdict so the next
      # incremental run can reuse it PROVABLY rather than trusting it. The
      # artifact name is unique per shard, so downloading a registry with
      # merge-multiple cannot collide.
      - name: Upload shard evidence to the reuse registry
        if: always()
        uses: ./.github/actions/upload-runtime
        with:
          name: mutation-registry-${{ matrix.shard }}
          path: backend/tests/generated/mutation/mutation-summary-${{ matrix.shard }}.json
          retention-days: 90
          if-no-files-found: warn

      - name: Job Summary
        if: always()
        shell: bash
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }} — shard ${{ matrix.shard }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          SUMMARY="backend/tests/generated/mutation/mutation-summary-${{ matrix.shard }}.json"
          if [ -f "$SUMMARY" ]; then
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Component | ${{ matrix.component }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Tier | ${{ matrix.tier }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Source files | ${{ matrix.file_count }} (${{ matrix.byte_size }} bytes) |" >> $GITHUB_STEP_SUMMARY
            echo "| Generated | $(jq -r '.mutants_generated' "$SUMMARY") |" >> $GITHUB_STEP_SUMMARY
            echo "| Killed | $(jq -r '.killed' "$SUMMARY") |" >> $GITHUB_STEP_SUMMARY
            echo "| Survived | $(jq -r '.survived' "$SUMMARY") |" >> $GITHUB_STEP_SUMMARY
            echo "| Score | $(jq -r '.mutation_score' "$SUMMARY")% |" >> $GITHUB_STEP_SUMMARY
            echo "| Execution | $(jq -r '.execution_status' "$SUMMARY") |" >> $GITHUB_STEP_SUMMARY
            echo "| Toolchain | $(jq -r '.toolchain_contract' "$SUMMARY") |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No shard summary was produced — the aggregate gate will fail this shard." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          .venv/bin/python -m runtime.verify doctor >> $GITHUB_STEP_SUMMARY

  mutation-replay:
    name: Mutation Replay (no measurement)
    # M9-C72 — reconcile evidence from a PRIOR run without re-measuring.
    #
    # The D1 incident cost a 15-minute campaign and an unbounded debugging
    # session for a 3-minute transport fault, because the only recovery path
    # was to re-measure everything. Replay separates the two concerns: the
    # aggregate gate is a pure function of the 26 shard summaries, so recovering
    # from a transport fault must cost a re-download, not a re-measurement.
    #
    # This is a REPAIR path, not a substitute for measurement: it proves the
    # stored evidence reconciles and clears the gate without claiming anything
    # about the current commit's code beyond what the evidence records.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'replay'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Resolve evidence run
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED: ${{ inputs['evidence-run-id'] }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            RUN_ID="$REQUESTED"
          else
            # Most recent run that actually produced shard artifacts. A run that
            # measured nothing would reconcile vacuously, so the count is the
            # filter, not recency alone.
            CANDIDATES=$(gh api "repos/$REPO/actions/workflows/mutation.yml/runs?status=completed&per_page=30" \
              --jq '[.workflow_runs[].id] | .[]')
            RUN_ID=""
            for id in $CANDIDATES; do
              COUNT=$(gh api "repos/$REPO/actions/runs/$id/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.name | startswith("mutation-shard-"))] | length')
              if [ "$COUNT" -ge 20 ]; then
                RUN_ID="$id"
                break
              fi
            done
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::No run with shard evidence was found. Pass evidence-run-id explicitly."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Reconciling evidence from run $RUN_ID." >> $GITHUB_STEP_SUMMARY

      - name: Download shard evidence from the prior run
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: "mutation-shard-*"
          path: runtime/generated/mutation-shards
          merge-multiple: "true"
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.evidence.outputs.run_id }}

      - name: Report downloaded shard evidence
        shell: bash
        run: |
          DIR=runtime/generated/mutation-shards
          COUNT=$(find "$DIR" -name 'mutation-summary-*.json' 2>/dev/null | wc -l | tr -d ' ')
          {
            echo "## Replay — evidence from run ${{ steps.evidence.outputs.run_id }}"
            echo ""
            echo "- shard summaries reconciled: **$COUNT**"
            echo "- mutation re-measured: **none**"
            echo ""
          } >> $GITHUB_STEP_SUMMARY
          echo "$COUNT" > /tmp/replay_count

      - name: Reconcile replayed evidence and enforce the campaign gate
        id: aggregate
        shell: bash
        run: |
          set +e
          .venv/bin/python -m runtime.verify mutation-aggregate \
            --shards-dir runtime/generated/mutation-shards \
            --json > runtime/generated/mutation-aggregate.json
          RC=$?
          set -e
          cat runtime/generated/mutation-aggregate.json
          echo "exit_code=$RC" >> $GITHUB_OUTPUT
          exit $RC

      - name: Stage replayed evidence for the measurement certifier
        shell: bash
        run: |
          # The aggregate gate reads whatever directory it is pointed at, but
          # `mutation-trust` reads the canonical evidence tree. Without this
          # copy the certification reports INVALID on a replay that measured
          # nothing — which would be true but useless, and would make the
          # repair path look broken for the wrong reason.
          SRC=runtime/generated/mutation-shards/backend/tests/generated/mutation
          DST=backend/tests/generated/mutation
          if [ -d "$SRC" ]; then
            mkdir -p "$DST"
            cp -f "$SRC"/*.json "$DST"/ 2>/dev/null || true
            echo "Staged $(find "$DST" -name 'mutation-summary-*.json' | wc -l | tr -d ' ') shard summaries for certification."
          else
            echo "::warning::No canonical evidence tree inside the downloaded artifacts; certification will run against whatever evidence is present."
          fi

      # Named as a summary step because that is exactly what it is: it appends
      # the certification outcome to the run summary and never fails the job.
      # G12 flags `if: always()` on a non-summary step because it can MASK a
      # gate failure — this one cannot, since the aggregate gate above carries
      # the verdict and has no `if: always()`. Naming it for what it does keeps
      # the audit trail honest instead of working around the gate.
      - name: Job Summary (measurement certification)
        if: always()
        shell: bash
        run: |
          set +e
          .venv/bin/python -m runtime.verify mutation-trust
          TRUST_RC=$?
          set -e
          echo "### Measurement certification (replayed evidence)" >> $GITHUB_STEP_SUMMARY
          if [ "$TRUST_RC" -eq 0 ]; then
            echo "✅ Measurement certified: dispatch valid, execution proven, 0 unknown survivors." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Measurement NOT certified (exit $TRUST_RC) — the replayed" >> $GITHUB_STEP_SUMMARY
            echo "evidence does not carry the sentinel and identity artefacts the" >> $GITHUB_STEP_SUMMARY
            echo "certification requires. The aggregate verdict above is still" >> $GITHUB_STEP_SUMMARY
            echo "authoritative for the SCORE; this gate covers whether the" >> $GITHUB_STEP_SUMMARY
            echo "measurement itself can be trusted, and replay cannot re-prove" >> $GITHUB_STEP_SUMMARY
            echo "execution for mutants it did not run." >> $GITHUB_STEP_SUMMARY
          fi
          exit 0

  mutation-aggregate:
    name: Mutation Aggregate Gate
    # The gate is the ONLY thing that turns shard evidence into a verdict, so it
    # must run whenever a measurement mode was requested — including the case
    # where the shard matrix expanded to nothing. `always()` plus an explicit mode
    # check replaces `needs.mutation.result != 'skipped'`: a skipped dependency
    # made this gate skip too, so a campaign that measured NOTHING reported the
    # same `failure` as a campaign that measured badly, with no shard evidence
    # and no explanation. Now the gate runs, finds an empty measured population,
    # and fails it as NOT EVALUABLE — which is the truth.
    needs: [mutation-plan, mutation]
    if: >-
      always()
      && needs.mutation-plan.result == 'success'
      && needs.mutation-plan.outputs.mode != 'replay'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Download all shard evidence
        uses: ./.github/actions/download-runtime
        with:
          pattern: "mutation-shard-*"
          path: runtime/generated/mutation-shards
          merge-multiple: "true"

      # M9-C72: an incremental run measures only the affected shards, so the
      # rest come from the registry recorded by the last full campaign. Every
      # cached entry is fingerprint-validated, and a stale one is a hard
      # reconciliation failure rather than a silent pass.
      - name: Restore recorded evidence for unmeasured shards
        if: env.MUTATION_MODE == 'incremental'
        uses: ./.github/actions/download-runtime
        with:
          pattern: "mutation-registry-*"
          path: runtime/generated/mutation-cache
          merge-multiple: "true"

      # Named as a summary step because that is what it does: it appends the
      # evidence-transport report to the run summary. G12 flags `if: always()`
      # on a non-summary step because it can mask a gate failure; this step
      # changes no verdict, and the gate below carries the outcome.
      - name: Job Summary (shard evidence transport)
        if: always()
        shell: bash
        run: |
          # M9-C72 — a gate must never fail for a reason it does not report.
          #
          # The D1 incident cost a full debugging session because the failing
          # step printed nothing: the download was unresolvable and the only
          # symptom, one job later, was "evidence missing" in the aggregate.
          # This step is pure diagnostics — it never changes the verdict — so
          # that a transport fault and a quality regression are distinguishable
          # from the log alone.
          DIR=runtime/generated/mutation-shards
          echo "### Shard evidence transport" >> $GITHUB_STEP_SUMMARY
          if [ ! -d "$DIR" ]; then
            echo "**No evidence directory at \`$DIR\`.**" >> $GITHUB_STEP_SUMMARY
            echo "The download step did not produce a directory, so no shard" >> $GITHUB_STEP_SUMMARY
            echo "summary could be read. This is a TRANSPORT fault, not a" >> $GITHUB_STEP_SUMMARY
            echo "measurement fault." >> $GITHUB_STEP_SUMMARY
          else
            COUNT=$(find "$DIR" -name 'mutation-summary-*.json' | wc -l | tr -d ' ')
            echo "- evidence directory: \`$DIR\`" >> $GITHUB_STEP_SUMMARY
            echo "- shard summaries downloaded: **$COUNT**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Downloaded shard summaries</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            find "$DIR" -name 'mutation-summary-*.json' -printf '%f\n' | sort >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Reconcile shards and enforce the campaign gate
        id: aggregate
        shell: bash
        run: |
          set +e
          if [ "$MUTATION_MODE" = "incremental" ] && [ -d runtime/generated/mutation-cache ]; then
            .venv/bin/python -m runtime.verify mutation-aggregate \
              --shards-dir runtime/generated/mutation-shards \
              --cache-dir runtime/generated/mutation-cache \
              --json > runtime/generated/mutation-aggregate.json
          else
            .venv/bin/python -m runtime.verify mutation-aggregate \
              --shards-dir runtime/generated/mutation-shards \
              --json > runtime/generated/mutation-aggregate.json
          fi
          RC=$?
          set -e
          cat runtime/generated/mutation-aggregate.json
          echo "exit_code=$RC" >> $GITHUB_OUTPUT
          exit $RC

      - name: Upload aggregate evidence
        if: always()
        uses: ./.github/actions/upload-runtime
        with:
          name: mutation-aggregate-evidence
          path: |
            runtime/generated/mutation-aggregate.json
            backend/tests/generated/mutation/mutation-summary-aggregate.json
            backend/tests/generated/mutation/mutation-summary-aggregate-result.json
          retention-days: 90
          if-no-files-found: warn

      - name: Job Summary
        if: always()
        shell: bash
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }} — aggregate gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f runtime/generated/mutation-aggregate.json ]; then
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Shards expected | $(jq -r '.expected_shards | length' runtime/generated/mutation-aggregate.json) |" >> $GITHUB_STEP_SUMMARY
            echo "| Generated | $(jq -r '.mutants_generated' runtime/generated/mutation-aggregate.json) |" >> $GITHUB_STEP_SUMMARY
            echo "| Killed | $(jq -r '.killed' runtime/generated/mutation-aggregate.json) |" >> $GITHUB_STEP_SUMMARY
            echo "| Survived | $(jq -r '.survived' runtime/generated/mutation-aggregate.json) |" >> $GITHUB_STEP_SUMMARY
            echo "| Score | $(jq -r '.mutation_score' runtime/generated/mutation-aggregate.json)% |" >> $GITHUB_STEP_SUMMARY
            echo "| Threshold | $(jq -r '.threshold_percent' runtime/generated/mutation-aggregate.json)% |" >> $GITHUB_STEP_SUMMARY
            echo "| Verdict | $(jq -r '.verdict' runtime/generated/mutation-aggregate.json) |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Shard | Component | Generated | Killed | Survived | Score |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-----------|-----------|--------|----------|-------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.shards[] | "| \(.name) | \(.name) | \(.mutants_generated) | \(.killed) | \(.survived) | \(if .score == null then "N/A" else "\(.score)%" end) |"' runtime/generated/mutation-aggregate.json >> $GITHUB_STEP_SUMMARY
            FAILURES="$(jq -r '.failures | length' runtime/generated/mutation-aggregate.json)"
            if [ "$FAILURES" != "0" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Reconciliation failures" >> $GITHUB_STEP_SUMMARY
              jq -r '.failures[] | "- \(.)"' runtime/generated/mutation-aggregate.json >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          .venv/bin/python -m runtime.verify doctor >> $GITHUB_STEP_SUMMARY

      - name: Enforce campaign gate
        if: always()
        shell: bash
        run: |
          RC="${{ steps.aggregate.outputs.exit_code }}"
          if [ "$RC" = "0" ]; then
            echo "✅ Mutation campaign gate satisfied"
          elif [ "$RC" = "2" ]; then
            echo "❌ Aggregate mutation score below threshold"
            exit 2
          else
            echo "❌ Mutation campaign NOT EVALUABLE — shard evidence incomplete (see reconciliation failures above)"
            exit 1
          fi
