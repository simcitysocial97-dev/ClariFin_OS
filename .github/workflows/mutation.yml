# .github/workflows/mutation.yml
#
# PURPOSE: Mutation testing — finds gaps in test effectiveness
# SCHEDULE: Nightly at 2 AM UTC (runs while you sleep)
# MANUAL:   Can also be triggered manually for specific engines
#
# Why nightly?
#   Mutation testing is slow (30-90 minutes for full suite)
#   It would make every PR take too long
#   Nightly gives you fresh results every morning

name: Mutation Testing

on:
  # Nightly schedule — 2 AM UTC = 7:30 AM IST
  schedule:
    - cron: "0 2 * * *"    # Every day at 2 AM UTC
  
  # Allow manual trigger with custom target
  workflow_dispatch:
    inputs:
      target-path:
        description: "Path to mutate (e.g., src/engines/loan_engine.py)"
        required: false
        default: ""
      
      engine-name:
        description: "Specific engine name (e.g., loan, credit_card)"
        required: false
        default: "all"

# No concurrency cancellation here
# We want mutation runs to complete fully
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ── Discover Mutation Targets ────────────────────────────────────────────
  discover:
    name: "Discover Mutation Targets"
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.discover.outputs.engines }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          working-directory: "backend"

      - name: Discover engines from runtime
        id: discover
        working-directory: backend
        run: |
          python -m tests.runtime.ci_targets --mutation --json > mutation-targets.json
          ENGINES=$(python -c "import json; data=json.load(open('mutation-targets.json')); print(json.dumps([p.split('/')[-1].replace('.py','') for p in data['mutation']]))")
          echo "engines=$ENGINES" >> "$GITHUB_OUTPUT"
          echo "Discovered engines: $ENGINES"

  # ── Selective Mutation (Nightly) ──────────────────────────────────────────
  mutation-engines:
    name: "Mutation — Engines"
    runs-on: ubuntu-latest
    timeout-minutes: 90    # Mutation is slow — give it time
    needs: discover
    
    strategy:
      # Run mutation for each engine in parallel
      # This distributes the work across multiple runners
      matrix:
        engine: ${{ fromJson(needs.discover.outputs.engines) }}
      
      # Continue other engines even if one fails
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          working-directory: "backend"

      - name: Find engine file
        id: find-engine
        working-directory: backend
        run: |
          ENGINE="${{ matrix.engine }}"
          ENGINE_PATH="src/engines/${ENGINE}.py"
          
          if [ -f "$ENGINE_PATH" ]; then
            echo "Found: $ENGINE_PATH"
            echo "engine-path=$ENGINE_PATH" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "Engine file not found for: $ENGINE"
            echo "engine-path=" >> "$GITHUB_OUTPUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run mutation testing
        if: steps.find-engine.outputs.found == 'true'
        working-directory: backend
        run: |
          ENGINE_PATH="${{ steps.find-engine.outputs.engine-path }}"
          ENGINE_NAME="${{ matrix.engine }}"
          
          echo "Mutating: $ENGINE_PATH"
          
          mkdir -p "tests/generated/mutation"
          
          # Run mutmut on this specific engine
          mutmut run \
            --paths-to-mutate "$ENGINE_PATH" \
            --runner "python -m pytest tests/unit/ tests/properties/ -x -q --timeout=30 2>&1" \
            2>&1 | tee "tests/generated/mutation/${ENGINE_NAME}-run.log"
          
          # Capture results
          mutmut results 2>&1 | tee "tests/generated/mutation/${ENGINE_NAME}-results.txt"
          
          # Show surviving mutants
          mutmut show 2>&1 | tee "tests/generated/mutation/${ENGINE_NAME}-survivors.txt" || true

      - name: Upload mutation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.engine }}-${{ github.run_id }}
          path: |
            backend/tests/generated/mutation/${{ matrix.engine }}*.log
            backend/tests/generated/mutation/${{ matrix.engine }}*.txt
          retention-days: 90    # Keep 3 months of mutation history

  # ── Aggregate Results ─────────────────────────────────────────────────────
  mutation-report:
    name: "Mutation — Aggregate Report"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: mutation-engines
    if: always()    # Generate report even if some engines failed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          working-directory: "backend"

      - name: Download all mutation artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-*-${{ github.run_id }}
          path: backend/tests/generated/mutation/
          merge-multiple: true

      - name: Generate aggregate report
        working-directory: backend
        run: |
          python ../.github/scripts/generate_mutation_report.py

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ github.run_id }}
          path: |
            backend/tests/generated/mutation/mutation-report.md
            backend/tests/generated/mutation/mutation-summary.json
          retention-days: 90

      - name: Comment on last commit (nightly)
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'backend/tests/generated/mutation/mutation-report.md';
            
            let report = '## Nightly Mutation Report\n\n';
            
            if (fs.existsSync(reportPath)) {
              report += fs.readFileSync(reportPath, 'utf8');
            } else {
              report += 'Mutation report not generated.';
            }
            
            // Create a commit comment
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: report.substring(0, 65536)  // GitHub limit
            });

      # Job Summary
      - name: Job Summary
        if: always()
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        shell: bash
