# .github/workflows/mutation.yml
#
# PURPOSE: Mutation testing — finds gaps in test effectiveness (nightly).
# RESPONSIBILITY: Run `runtime/verify.py mutation` — the ONLY verification command.
# Rule 1: no engineering logic in YAML. Rule 2: single responsibility. Rule 8:
# delegate to runtime/verify.py. Rule 9: append `verify.py status` summary.
# Concurrency: never cancel (mutation is in the Rule 6 exception list).
#
# The selective-mutation logic (run_mutation_selective.sh) owns discovery,
# execution and aggregate-report generation. The workflow only orchestrates.

name: Mutation Testing

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      target-path:
        description: "Path to mutate (e.g. src/engines/loan_engine.py)"
        required: false
        default: ""
      engine-name:
        description: "Specific engine name (e.g. loan, credit_card)"
        required: false
        default: "all"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Run mutation testing
        run: python runtime/verify.py mutation

      - name: Upload shared artifact — cross-layer-map
        uses: ./.github/actions/upload-runtime
        with:
          name: cross-layer-map
          path: runtime/generated/cross-layer-map.json
          retention-days: 14

      - name: Upload shared artifact — knowledge-index
        uses: ./.github/actions/upload-runtime
        with:
          name: knowledge-index
          path: runtime/generated/knowledge-index.json
          retention-days: 14

      - name: Upload shared artifact — verification-cache
        uses: ./.github/actions/upload-runtime
        with:
          name: verification-cache
          path: runtime/generated/verification-cache.json
          retention-days: 14

      - name: Upload shared artifact — engineering-history
        uses: ./.github/actions/upload-runtime
        with:
          name: engineering-history
          path: runtime/generated/engineering-history.json
          retention-days: 14

      - name: Upload mutation report
        uses: ./.github/actions/upload-runtime
        with:
          name: mutation-report
          path: |
            backend/tests/generated/mutation/mutation-report.md
            backend/tests/generated/mutation/mutation-summary.json
          retention-days: 90

      - name: Upload mutation evidence
        uses: ./.github/actions/upload-runtime
        with:
          name: mutation-evidence
          path: backend/tests/generated/mutation/
          retention-days: 30

      - name: Classify mutation result
        id: mutation
        if: always()
        run: |
          if [ -f "backend/tests/generated/mutation/mutation-summary.json" ]; then
            EXIT_CODE=$(jq -r '.mutmut_rc' backend/tests/generated/mutation/mutation-summary.json)
            SCORE=$(jq -r '.score_percent' backend/tests/generated/mutation/mutation-summary.json)
            THRESHOLD=$(jq -r '.threshold_percent' backend/tests/generated/mutation/mutation-summary.json)
            KILLED=$(jq -r '.killed' backend/tests/generated/mutation/mutation-summary.json)
            SURVIVED=$(jq -r '.survived' backend/tests/generated/mutation/mutation-summary.json)
            TIMEOUT=$(jq -r '.timeout' backend/tests/generated/mutation/mutation-summary.json)
            echo "mutation_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
            echo "mutation_score=$SCORE" >> $GITHUB_OUTPUT
            echo "mutation_threshold=$THRESHOLD" >> $GITHUB_OUTPUT
            echo "mutation_killed=$KILLED" >> $GITHUB_OUTPUT
            echo "mutation_survived=$SURVIVED" >> $GITHUB_OUTPUT
            echo "mutation_timeout=$TIMEOUT" >> $GITHUB_OUTPUT
          else
            echo "mutation_exit_code=1" >> $GITHUB_OUTPUT
            echo "mutation_score=N/A" >> $GITHUB_OUTPUT
            echo "mutation_threshold=80" >> $GITHUB_OUTPUT
            echo "mutation_killed=0" >> $GITHUB_OUTPUT
            echo "mutation_survived=0" >> $GITHUB_OUTPUT
            echo "mutation_timeout=0" >> $GITHUB_OUTPUT
          fi

      - name: Job Summary
        if: always()
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Mutation Testing Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric       | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Score        | ${{ steps.mutation.outputs.mutation_score }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Threshold    | ${{ steps.mutation.outputs.mutation_threshold }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Killed       | ${{ steps.mutation.outputs.mutation_killed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Survived     | ${{ steps.mutation.outputs.mutation_survived }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timeout      | ${{ steps.mutation.outputs.mutation_timeout }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Exit Code    | ${{ steps.mutation.outputs.mutation_exit_code }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.mutation.outputs.mutation_exit_code }}" = "0" ]; then
            echo "✅ Mutation score meets threshold" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.mutation.outputs.mutation_exit_code }}" = "1" ]; then
            echo "❌ Infrastructure failure (check logs)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Mutation score below threshold" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          python runtime/verify.py status >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Fail if mutation score below threshold
        if: steps.mutation.outputs.mutation_exit_code != '0'
        run: exit 1
