# .github/workflows/security-codeql.yml
#
# PURPOSE: GitHub CodeQL security analysis surface (VEA-5 M9).
# RESPONSIBILITY: Run github/codeql-action to analyze the repository's
#   security-relevant languages (Python backend/runtime + JavaScript/TypeScript
#   frontend) and upload results to GitHub code scanning. This is the
#   SOURCE-CONTROLLED successor to the GitHub-managed dynamic CodeQL workflow
#   (dynamic/github-code-scanning/codeql); the source-controlled workflow is the
#   authoritative, auditable, versioned analysis surface.
#
# ARCHITECTURE POSITION: Security analysis is a DISTINCT VEA-5 category (see
#   runtime/foundation/verification/evidence_contract.py DeepVerificationDomain.
#   SECURITY). It does NOT delegate to `python -m runtime.verify` (CodeQL is GitHub-
#   native and cannot run inside the local execution budget); it does NOT replace
#   any existing verification owner (unit/integration/contract/frontend/mutation/
#   golden/playwright/dependency). It is the `deep-codeql` DEEP surface made real.
#
# TRIGGERS (M9 §8):
#   - pull_request  : PR security feedback (PR-visible findings)
#   - push (main)   : "merge" cadence — default-branch security analysis
#   - workflow_disp : manual re-scan
#   - schedule      : weekly deep scan (off-peak)
# PATH FILTER: intentionally ABSENT. A security workflow must not silently skip
#   security-sensitive changes (M9 §9); it scans every change. (quality.yml uses
#   the same no-filter pattern for its fast gate.)
#
# PERMISSIONS (M9 §7 — least privilege, each justified):
#   - security-events: write  REQUIRED to upload the SARIF to GitHub code scanning.
#   - contents: read          REQUIRED to check out repository contents for analysis.
#   - actions: read          REQUIRED by github/codeql-action to read run metadata.
#   - pull-requests: write   Enables CodeQL PR annotations that surface findings
#                             inline on the PR (the PR-feedback objective).
#
# FAILURE SEMANTICS (M9 §6/§14): the analysis step has NO continue-on-error, so a
#   failed analysis fails the job. Security-analysis failure is NEVER silently
#   converted to success.
#
# Rule 1: no engineering logic inlined. Rule 8: delegate to github/codeql-action.
# Rule 9: workflow summary records outcomes (security surface, not verify.py).

name: CodeQL Security Analysis

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  contents: read
  actions: read
  pull-requests: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # Explicit ownership for every security-relevant language.
          #
          # `actions` is included deliberately. GitHub's default CodeQL setup is
          # not configured on this repository, so this workflow is the only
          # analysis surface. Without `actions`, workflow files had no owner: the
          # actions database was written on 2026-08-10 by the now-retired default
          # setup and never again until this workflow added the language.
          #
          # That ownership gap is now closed. Verified 2026-10-02 against the
          # code-scanning databases API: python-database, javascript-database and
          # actions-database are all maintained by this workflow (each last
          # written 2026-10-02T00:58:4xZ by run #110 on main). The 12
          # actions/missing-workflow-permissions alerts the retired default setup
          # raised on 2026-08-10 have since been re-analysed and all 12 are
          # dismissed; each points at a workflow that does declare an explicit
          # `permissions:` block, so dismissal is the correct disposition rather
          # than closure on age.
          #
          # Default setup remains disabled, so there is no duplicate analysis of
          # python or javascript.
          #
          # WHY THE ACTIONS LIST STILL SHOWS THREE "CodeQL" ENTRIES. This is a
          # display artefact of dead registrations, not a second analysis, and is
          # deliberately NOT "fixed" by reducing coverage here:
          #   - "CodeQL" (id 330860652, dynamic/github-code-scanning/codeql) is the
          #     retired default setup. Its last run was 2026-08-12; it has not run
          #     since, because this workflow is now the active surface.
          #   - "CodeQL Security Analysis" (id 332570115, codeql.yml) never existed
          #     on main. It was created and deleted on the branch
          #     verification-framework-codeql-integration and retains one cancelled
          #     run from 2026-08-12.
          #   - this workflow (id 332453015, security-codeql.yml) is the live one.
          # Only this workflow writes the three databases above, which is the
          # decisive evidence that default setup is not running alongside it.
          languages: python, javascript, actions
          config: |
            # One vendored, upstream-generated bundle is excluded, and nothing
            # else is.
            #
            # `frontend/public/pdf.worker.mjs` is the pdf.js distribution build
            # (~1.9 MB, Apache-2.0 header, byte-identical to upstream release).
            # It IS part of the maintained production artifact — the browser
            # loads it — so it is not deleted; but findings inside it are
            # defects in pdf.js, fixed by upgrading pdf.js, not by editing a
            # vendored file this repository does not author. `js/double-escaping`
            # (alert #20) is one such finding at line 37056.
            #
            # The exclusion is per-file and named, not a directory or a pattern,
            # so the rest of `frontend/` — including the hand-written worker
            # wrapper — is analysed normally.
            paths-ignore:
              - frontend/public/pdf.worker.mjs

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Job Summary
        if: always()
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Security analysis status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
        shell: bash
