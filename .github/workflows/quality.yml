# .github/workflows/quality.yml
#
# PURPOSE: Fast quality gate (lint, format, typecheck, unit, architecture, meta).
# RESPONSIBILITY: Run `python -m runtime.verify quick` — the ONLY verification command.
# BLOCKS:  Merging if it fails.
#
# Rule 1: No engineering logic duplicated here. Rule 2: exactly one command.
# Rule 3: shared artifacts generated once by bootstrap-runtime. Rule 8: delegate
# to python -m runtime.verify. Rule 9: append `runtime.verify status` to the job summary.

name: Quality Gate

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Setup Node.js runtime
        uses: ./.github/actions/setup-node-runtime
        with:
          node-version: "24"
          working-directory: "frontend"

      - name: Run quick verification
        run: python -m runtime.verify quick

      - name: Upload shared artifact — cross-layer-map
        uses: ./.github/actions/upload-runtime
        with:
          name: cross-layer-map
          path: runtime/generated/cross-layer-map.json
          retention-days: 14

      - name: Upload shared artifact — knowledge-index
        uses: ./.github/actions/upload-runtime
        with:
          name: knowledge-index
          path: runtime/generated/knowledge-index.json
          retention-days: 14

      - name: Upload shared artifact — verification-cache
        uses: ./.github/actions/upload-runtime
        with:
          name: verification-cache
          path: runtime/generated/verification-cache.json
          retention-days: 14

      - name: Upload shared artifact — engineering-history
        uses: ./.github/actions/upload-runtime
        with:
          name: engineering-history
          path: runtime/generated/engineering-history.json
          retention-days: 14

      - name: Upload quality report
        uses: ./.github/actions/upload-runtime
        with:
          name: quality-report
          path: |
            runtime/generated/verification-report.md
            runtime/generated/verification/
          retention-days: 14

      - name: Upload evidence
        uses: ./.github/actions/upload-runtime
        with:
          name: fast-checks-evidence
          path: runtime/generated/execution/
          retention-days: 30

      - name: Job Summary
        if: always()
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -m runtime.verify status >> $GITHUB_STEP_SUMMARY
        shell: bash
