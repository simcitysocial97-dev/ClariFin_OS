# .github/workflows/quality.yml
#
# PURPOSE: Repository and static/application quality.
# RESPONSIBILITY: Run `runtime verify quick` — the canonical static quality
#   profile: ruff, black, mypy-strict, backend unit tests.
# BLOCKS:  Merging if it fails.
#
# WHY THIS WORKFLOW EXISTS, AND WHY IT DOES NOT RUN `verify check`
#
# This workflow originally owned lint, format, unit and coverage. Commit
# b326f08e ("Program 11 — Engineering Platform Closure") replaced those steps
# with a single `runtime/verify.py quick` call, and later C70 work widened it to
# `runtime verify check` — change-boundary capability verification. That is a
# different responsibility, and verification-reconcile.yml already owns it.
#
# Running `verify check` here meant the same expensive repository-level runtime
# verification executed twice for the same event (once here, once in
# verification-reconcile), and it displaced the static checks rather than adding
# to them.
#
#   Quality Gate          = repository/static/application quality (this file)
#   Verification Reconcile = runtime change-boundary verification + reconciliation
#
# The split is by cost class as well as by subject: the checks here are static
# and total (they read the whole tree regardless of the change boundary), while
# verification is scoped to the boundary and is the expensive one.
#
# `quick` is the repository's existing definition of quality. Nothing here is a
# replacement implementation: every command comes from the quick profile in
# runtime/foundation/verification/profiles.py, so local and CI execute the same
# checks and a profile change takes effect here automatically.

name: Quality Gate

on:
  push:
    branches:
      - "main"      # Scoped to the integration branches, not "**". A feature branch
      # push and its pull_request event are the same commit, so "**" made
      # this workflow run twice per PR and report twice under the same name.
      # Feature branches now run via pull_request only; main/develop still run
      # via push. Same convention as playwright.yml and security-codeql.yml.
      - "develop"
    paths:
      - "backend/**"
      - "runtime/**"
      - "frontend/**"
      - "tools/**"
      - "scripts/**"
      - ".github/workflows/quality.yml"
      - ".github/actions/**"
      # M11 (Task 4 — path-filter audit). A path filter must cover every input
      # the job actually reads. This workflow now reads three directories that
      # the filter omitted, so a change to any of them could not trigger the
      # gate that validates or executes it:
      #   .github/scripts/**       the job EXECUTES
      #                             run_frontend_verification.sh and
      #                             validate_actions.py.
      #   .github/workflows/**     the job READS every workflow file, because
      #                             validate_actions.py validates all of them.
      #                             Widening from the single-file
      #                             `.github/workflows/quality.yml` entry is
      #                             required by the validation step, not
      #                             optional.
      #   (`.github/actions/**` was already present and stays.)
      # NOTE the contrast with the four REQUIRED checks, which deliberately have
      # no `paths:` filter at all: a required context that a filter skips never
      # reports, and GitHub treats that as unsatisfied. This filter is safe
      # precisely because "Quality Gate" is not a required context.
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "pyproject.toml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "runtime/**"
      - "frontend/**"
      - "tools/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      # M11 (Task 7). `.github/scripts/validate_actions.py` has existed since
      # M9-C72 and enforces eight rules over `.github/workflows/**` and
      # `.github/actions/**` — Rule 8 (a verification workflow must delegate to
      # its `runtime.verify` profile), pinning-free action usage, undefined-`uses:`
      # detection, and more. Nothing in CI ever executed it. That is why
      # `frontend-verify.yml` sat for a full milestone invoking
      # `.github/scripts/run_frontend_verification.sh` directly while the
      # validator that would have rejected it sat unused in the tree: the
      # validator was correct, and unreachable.
      #
      # It runs here, in the Quality Gate, for two reasons. Quality Gate is NOT
      # one of the four required contexts, so a newly-introduced workflow
      # violation cannot make a pull request permanently unmergeable by
      # suppressing a required check. And Quality Gate's own `paths` filter now
      # includes `.github/workflows/**` — see the filter comment above — so a
      # change to any workflow file does reach this step.
      #
      # No `continue-on-error`: a violation is a failure, not a warning. The
      # script is stdlib-only (`ast`, `pathlib`, `re`, `sys`) and needs no
      # interpreter of its own.
      - name: Workflow constitution (validate_actions.py)
        shell: bash
        run: .venv/bin/python .github/scripts/validate_actions.py

      # ruff, black, mypy-strict, backend unit tests. Each check reports through
      # the runtime so a failure names the task and its output, not a bare
      # non-zero exit.
      - name: Static quality checks (canonical quick profile)
        shell: bash
        run: |
          .venv/bin/python -m runtime.verify quick

      - name: Frontend typecheck and lint
        uses: ./.github/actions/setup-node-runtime
        with:
          node-version: "24"

      - name: Frontend static checks (eslint, tsc, vitest)
        shell: bash
        run: |
          # Reuses the repository's existing frontend verification script, which
          # already owns backend startup, phase isolation and evidence
          # recording. Only the static phases are selected here; the production
          # build stays with Frontend Verification so the two required workflows
          # do not each pay for the other's work.
          FRONTEND_VERIFICATION_PHASES="lint typecheck test" \
            bash .github/scripts/run_frontend_verification.sh

      - name: Upload Frontend test output
        uses: ./.github/actions/upload-runtime
        with:
          name: quality-frontend
          path: |
            frontend/test-results/**
            frontend/coverage/**
          retention-days: 7
          if-no-files-found: ignore

      # M11 (Agent 4 handoff). `scripts/test-platform-readiness.sh` was written
      # and passes 12/12 locally, but nothing ran it, so the launcher's
      # readiness classifier had no CI protection at all.
      #
      # Why Quality Gate and not a required workflow: this asserts on the
      # OPERATOR surface (the launcher's four-state verdict), not on product
      # verification. Putting it behind a required context would let a launcher
      # defect block every pull request. Quality Gate is not required, and its
      # `paths:` filter already lists `scripts/**`, so a change to the launcher
      # or to this test does reach it.
      #
      # Self-contained: bash, curl and `.venv/bin/python` (used only to spawn
      # throwaway TCP fixtures on an ephemeral port). It needs no backend, no
      # built frontend, and no free port in advance.
      - name: Launcher platform-readiness classification
        shell: bash
        run: bash scripts/test-platform-readiness.sh

      - name: Runtime status
        shell: bash
        run: |
          # Rule 9: the workflow summary records outcomes rather than the raw
          # command surface. This is the cheap inspect query — it is not
          # verification, and running it here does not duplicate
          # verification-reconcile.yml.
          .venv/bin/python -m runtime.verify status >> "$GITHUB_STEP_SUMMARY"

      - name: Quality summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Quality Gate"
            echo ""
            echo "- static checks: runtime verify quick (ruff, black, mypy, unit)"
            echo "- frontend: eslint, tsc, vitest via run_frontend_verification.sh"
          } >> "$GITHUB_STEP_SUMMARY"
