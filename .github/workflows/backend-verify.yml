# .github/workflows/backend-verify.yml
#
# PURPOSE: Backend verification via the autonomous runtime.
# RESPONSIBILITY: Run `runtime/verify.py check` — the canonical verification command.
# Rule 1: no engineering logic in YAML. Rule 2: single responsibility. Rule 8:
# delegate to runtime/verify.py. Rule 9: append `verify.py status` summary.

name: Backend Verification

on:
  push:
    branches:
      - "main"      # Scoped to the integration branches, not "**". A feature branch
      # push and its pull_request event are the same commit, so "**" made
      # this workflow run twice per PR and report twice under the same name.
      # Feature branches now run via pull_request only; main/develop still run
      # via push. Same convention as playwright.yml and security-codeql.yml.
      - "develop"
  pull_request:
    branches:
      - main
      - develop
    # No `paths:` filter, deliberately, and for the same reason
    # verification-runtime.yml has none.
    #
    # "Backend Verification" is a required_status_checks entry in the
    # `protect-main-branch` ruleset. A required check that a path filter skips
    # never reports, and GitHub treats a required context that does not report as
    # unsatisfied — so a pull request touching none of the filtered paths was
    # permanently BLOCKED with every reported check green. It is the same
    # failure verification-runtime.yml already fixed for itself, and it was
    # still present here: a PR changing only `frontend/`, `tools/`, `docs/` or
    # `.github/` could never be merged, and the checks list gave no clue why.
    #
    # This check is a TOTAL backend verification (`runtime verify backend`), not
    # a change-boundary one. Boundary-scoped runtime verification is owned by
    # Verification Reconcile (`runtime verify check`) — a different command over
    # a different scope — so dropping the filter adds a report, not a second copy
    # of the same work.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # M11 (Task 8 — permissions minimisation): `pull-requests: write` removed.
  # This job calls no pull-request API — checkout, the bootstrap composite,
  # `runtime.verify backend`, four artifact uploads and a job summary — so the
  # scope was unearned privilege on a job that executes untrusted repository
  # code (pytest, mutmut, mypy over the PR's own backend). Same reasoning, and
  # the same prior art, as api-contracts.yml, which removed the identical scope
  # from the workflow that checks out `workflow_run.head_sha`.
  # `security-events: write` is deliberately NOT granted here: SARIF upload
  # belongs to security-codeql.yml alone, which does need it for PR
  # annotations and does declare it.
  contents: read

# M10-R2 — Backend Verification is now plan -> matrix -> aggregate.
#
# The `backend` profile has six genuinely independent obligations (ruff, black, mypy,
# unit, integration, schemathesis): 600s of estimates serially, 180s on the critical
# path, so ~3.3x is available from fan-out alone. Each leg executes one canonical
# obligation, taken from the profile's own task list — not a hand-written command — so a
# leg cannot drift from what would have run in-process.
#
# Properties preserved:
#
#   * Required identity unchanged. The `verify` job is still named "Backend
#     Verification" and is still what branch protection waits on. The plan and matrix
#     legs are implementation workers, not new required checks.
#   * The gate is the authority. It refuses to certify unless every obligation
#     reported exactly once and passed. A red or absent leg fails Backend Verification.
#   * No artificial `needs:` chain. ruff/black/mypy/unit/integration/schemathesis are
#     declared independent by the profile model, so they get no edges between them.
#     Only the evidence rollup waits, because it reads what the legs produced.
jobs:
  # ---------------------------------------------------------------------
  # 1. Plan. Publishes the obligation matrix.
  # ---------------------------------------------------------------------
  backend-plan:
    name: Backend Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      leg_count: ${{ steps.plan.outputs.leg_count }}
      estimated_speedup: ${{ steps.plan.outputs.estimated_speedup }}
    env:
      VERIFICATION_OFFLINE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Emit canonical obligation matrix
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          MATRIX="$(.venv/bin/python -m runtime.verify backend-plan)"
          # See verification-runtime.yml: the heredoc terminator must be inside the
          # redirected block, or the matrix is never published and every leg is
          # skipped with "Matching delimiter not found". Shape copied from the proven
          # mutation.yml emission.
          # M10-R3 (L1): this projection selects the MATRIX SHAPE, not the payload.
          # It used to name the six fields it wanted, which meant every field the
          # runtime added was silently dropped unless five YAML files were edited in the
          # same commit. `estimated_seconds_serial` and `cpu_peak` (Checkpoint D) were
          # dropped by all five workflows. Selecting `.include` whole makes that class
          # of drift impossible: the matrix is whatever the runtime said it is.
          MATRIX_JSON="$(jq -c '{include: .include}' <<< "$MATRIX")"
          {
            echo "matrix<<MUTMATRIX_EOF"
            echo "$MATRIX_JSON"
            echo "MUTMATRIX_EOF"
            echo "leg_count=$(jq -r '.leg_count' <<< "$MATRIX")"
            echo "estimated_speedup=$(jq -r '.estimated_speedup' <<< "$MATRIX")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Backend obligations"
            echo ""
            echo "| Obligation | Est. seconds |"
            echo "|---|---|"
            jq -r '.include[] | "| \(.task_id) | \(.estimated_seconds) |"' <<< "$MATRIX"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # 2. Matrix legs. One canonical obligation per dedicated runner.
  # ---------------------------------------------------------------------
  backend-obligation:
    name: Backend ${{ matrix.task_id }}
    needs: [backend-plan]
    if: needs.backend-plan.result == 'success' && needs.backend-plan.outputs.leg_count != '0'
    runs-on: ubuntu-latest
    # LITERAL: a matrix job whose own `timeout-minutes` reads `needs.<job>.outputs` is
    # never created (see mutation.yml). The real budget is enforced with GNU `timeout`.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Modest, not maximal: `run_contract_tests.sh` passes `-n auto` internally, so a
      # leg already forks its own workers. A large matrix multiplied by that would
      # oversubscribe the runner and trade elapsed time for flaky timeouts.
      max-parallel: 4
      matrix: ${{ fromJson(needs.backend-plan.outputs.matrix) }}
    env:
      VERIFICATION_OFFLINE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      - name: Run this canonical obligation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p runtime/generated/legs
          # Narrow `|| true`: a red obligation must still write its result document, or
          # the gate reports "missing" instead of the real failure.
          set +e
          # M10-R3 (L1c): the budget is the runtime's, published per leg by
          # `verify backend-plan` as `required_timeout_minutes`. This used to carry its
          # own `:-1500` literal, which agreed with the runtime only by coincidence.
          # Exported so the runtime can refuse to start if the wrapper is smaller than the
          # obligation it wraps.
          OBLIGATION_BACKSTOP_SECONDS=$(( ${{ matrix.required_timeout_minutes }} * 60 ))
          export VERIFY_INFRA_BACKSTOP_SECONDS="$OBLIGATION_BACKSTOP_SECONDS"
          timeout "${OBLIGATION_BACKSTOP_SECONDS}s" \
            .venv/bin/python -m runtime.verify backend-task \
              --task "${{ matrix.task_id }}" \
              --result-out "runtime/generated/legs/leg-${{ matrix.index }}.json"
          RC=$?
          set -e
          echo "${{ matrix.task_id }} exit=${RC}" >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

      - name: Upload obligation result
        # SINGLE-PATH ROOT — see verification-reconcile.yml for why. With one path the
        # artifact root IS the directory, so a flat merge lands `leg-<n>.json` exactly
        # where the gate looks for it.
        if: always()
        uses: ./.github/actions/upload-runtime
        with:
          name: backend-result-${{ matrix.index }}
          path: runtime/generated/legs/leg-${{ matrix.index }}.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload obligation artifacts
        if: always()
        uses: ./.github/actions/upload-runtime
        with:
          # Interpolates `matrix.` — required by validate_actions.py rule 12.
          name: backend-obligation-${{ matrix.index }}
          path: |
            runtime/generated/legs/
            runtime/generated/profile-logs/backend/
            runtime/generated/evidence/
          retention-days: 14

  # ---------------------------------------------------------------------
  # 3. The required check. Sole certification authority.
  # ---------------------------------------------------------------------
  verify:
    name: Backend Verification
    needs: [backend-plan, backend-obligation]
    # `always()`: one red obligation must not suppress the gate, or the required check
    # never reports and the PR blocks with no conclusion.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bootstrap Engineering Runtime
        uses: ./.github/actions/bootstrap-runtime
        with:
          python-version: "3.12"

      # mutation.yml's transport: obligation filenames already carry the index, so
      # flattening every artifact into ONE directory cannot collide.
      - name: Download all obligation results
        uses: ./.github/actions/download-runtime
        with:
          pattern: "backend-*"
          path: runtime/generated/legs
          merge-multiple: "true"

      # Pure diagnostics, never a verdict. Named so G12 does not read `if: always()`
      # as failure masking: transport faults must be distinguishable in the log alone.
      - name: Job Summary (obligation evidence transport)
        if: always()
        shell: bash
        run: |
          DIR=runtime/generated/legs
          echo "### Backend obligation evidence transport" >> $GITHUB_STEP_SUMMARY
          if [ ! -d "$DIR" ]; then
            echo "**No obligation directory at $DIR.** TRANSPORT fault, not a test fault." \
              >> $GITHUB_STEP_SUMMARY
          else
            echo "- obligation results: **$(find "$DIR" -name 'leg-*.json' | wc -l | tr -d ' ')**" \
              >> $GITHUB_STEP_SUMMARY
          fi

      - name: Aggregate obligations (canonical gate)
        shell: bash
        run: |
          set -uo pipefail
          AGG=runtime/generated/legs
          mkdir -p "$AGG"
          # Fail closed, with a cause. See verification-runtime.yml: the obligation
          # count is never inferred from the results received, because that would make
          # a missing obligation undetectable.
          COUNT="${{ needs.backend-plan.outputs.leg_count }}"
          if [ -z "$COUNT" ]; then
            echo "::error::The backend plan job published no obligation count, so the fan-out cannot be verified. Refusing to certify an unverified plan — see the 'Backend Plan' job for the cause."
            exit 2
          fi
          find runtime/generated/legs -name 'leg-*.json' \
            -exec cp {} "$AGG"/ \; 2>/dev/null || true
          set +e
          .venv/bin/python -m runtime.verify backend-aggregate \
            --legs "$AGG" \
            --json | tee "$AGG/gate.json"
          GATE_RC=${PIPESTATUS[0]}
          set -e
          if [ "$GATE_RC" -ne 0 ]; then
            echo "::error::Backend Verification did not certify. Every canonical obligation must report and pass."
          fi
          exit "$GATE_RC"

      - name: Upload shared artifact — cross-layer-map
        uses: ./.github/actions/upload-runtime
        with:
          name: cross-layer-map
          path: runtime/generated/cross-layer-map.json
          retention-days: 14

      - name: Upload shared artifact — knowledge-index
        uses: ./.github/actions/upload-runtime
        with:
          name: knowledge-index
          path: runtime/generated/knowledge-index.json
          retention-days: 14

      - name: Upload shared artifact — verification-cache
        uses: ./.github/actions/upload-runtime
        with:
          name: verification-cache
          path: runtime/generated/verification-cache.json
          retention-days: 14

      - name: Upload shared artifact — engineering-history
        uses: ./.github/actions/upload-runtime
        with:
          name: engineering-history
          path: runtime/generated/engineering-history.json
          retention-days: 14

      - name: Upload backend report
        uses: ./.github/actions/upload-runtime
        with:
          name: backend-report
          path: |
            runtime/generated/verification-report.md
            runtime/generated/verification/
          retention-days: 14

      - name: Upload backend evidence
        uses: ./.github/actions/upload-runtime
        with:
          name: backend-evidence
          path: runtime/generated/execution/
          retention-days: 30

      - name: Job Summary
        if: always()
        run: |
          echo "## ${{ github.workflow }} — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          .venv/bin/python -m runtime.verify status >> $GITHUB_STEP_SUMMARY
        shell: bash
