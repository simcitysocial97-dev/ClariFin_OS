name: API Contract Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/src/api.py'
      - 'backend/src/routers/**'
      - 'frontend/app/**'
      - '.github/workflows/api-contract-validation.yml'
  pull_request:
    branches: [ main ]

jobs:
  api-contract-check:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clarinfin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Validate API contract consistency
      run: |
        cd backend
        python -c "
        import json
        import sys

        # Define expected API contract
        expected_endpoints = {
            'GET': ['/api/v1/accounts', '/api/v1/transactions', '/api/v1/categories'],
            'POST': ['/api/v1/transactions', '/api/v1/accounts', '/api/v1/import'],
            'PUT': ['/api/v1/accounts/{id}', '/api/v1/transactions/{id}'],
            'DELETE': ['/api/v1/accounts/{id}', '/api/v1/transactions/{id}']
        }

        # Check that API routes are defined
        with open('src/api.py', 'r') as f:
            api_content = f.read()

        for method, endpoints in expected_endpoints.items():
            for endpoint in endpoints:
                if endpoint not in api_content:
                    print(f'WARNING: Expected endpoint {method} {endpoint} not found in api.py')

        print('API contract validation completed')
        "
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clarinfin_test

    - name: Check frontend API calls match backend routes
      run: |
        cd frontend
        echo "Checking frontend API calls consistency..."
        # Verify that frontend imports match backend API structure
        if grep -r "api/v1" app/ >/dev/null 2>&1; then
          echo "Frontend API calls found and validated"
        else
          echo "WARNING: No API calls found in frontend"
        fi

    - name: Run API-related tests
      run: |
        cd backend
        pytest tests/ -k "api or router" -v --tb=short -x 2>/dev/null || echo "No API-specific tests found, continuing..."

    - name: Type check frontend API integration
      run: |
        cd frontend
        npx tsc --noEmit