# backend/pyproject.toml
# Scoped configuration authority for the backend source tree.
#
# M10 note:
#   * Dependencies are NOT declared here — root pyproject.toml is the SINGLE
#     Python dependency authority (`.venv` single-venv architecture).
#   * Ruff / Black configuration are canonicalized at repo root
#     (root pyproject.toml [tool.ruff] / [tool.black]); backend/ruff.toml is the
#     backend-scoped lint selection. No `[tool.ruff]` / `[tool.black]` here (the
#     previous duplicate in this file conflicted with backend/ruff.toml).
#   * This file remains the authority for pytest / Mypy-strict / Mutmut /
#     Hypothesis because backend tests resolve their rootdir here.

[tool.mypy]
python_version = "3.12"
strict = true

namespace_packages = false

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true

exclude = [
    "tests/",
]

# Test configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["probes"]
pythonpath = ["src", "tests"]
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "capability: mark test as capability smoke test",
    "contract: mark test as contract test",
    "property: mark test as property test",
    "invariant: mark test as invariant test",
    "golden: mark test as golden dataset test",
    "meta: mark test as meta test",
    "slow: marks tests as slow (deselect with '-m not slow')",
    "mutation: marks tests specifically for mutation testing",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "performance: marks performance tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:src.core.dtos.*",
    "ignore::pytest.PytestDeprecationWarning",
    "ignore::_pytest.warning_types.PytestAssertRewriteWarning",
    "ignore:Please use `import python_multipart` instead:PendingDeprecationWarning",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--no-header",
]
timeout = 60

[tool.hypothesis]
default_profile = "default"

[tool.hypothesis.profiles]
default = { max_examples = 20, deadline = 5000 }
ci = { max_examples = 150, deadline = 10000 }
nightly = { max_examples = 1000, deadline = 30000 }

# External third-party libraries only
[[tool.mypy.overrides]]
module = ["camelot.*", "pdfplumber.*", "cachetools.*", "fastapi.*", "pydantic.*", "pandas.*", "uvicorn.*", "sqlite3"]
ignore_missing_imports = true
# Note: camelot is a PDF table extraction library without type stubs.
# The import-untyped error is expected and suppressed via ignore_missing_imports.
# This is a third-party dependency limitation, not a code issue.

[tool.mutmut]
# ── Canonical mutation configuration (single source of truth) ───────────────
# Consumed by BOTH the bounded local smoke test and the authoritative CI run.
# CI mutates the full `source_paths` scope; local smoke bounds the target via
# `mutmut run "module.function*"` selection. The configuration itself is shared.
#
# Mutation is authoritative in CI. Do NOT reduce `source_paths` to the smoke
# target. Do NOT report the local smoke result as a mutation score.

# Directories to mutate (full authoritative scope for CI).
source_paths = ["src/engines/"]
# Also copy the full src tree so tests can import non-mutated modules.
also_copy = ["src"]
# Test runner — `python3` per repository convention (ubuntu-latest ships
# `python3`, never bare `python`).
runner = "python3 -m pytest"
# Which tests to run per mutant. Both local smoke and CI share this selection.
# Includes unit, properties, invariants, contract, and integration tests.
pytest_add_cli_args_test_selection = [
    "tests/unit/",
    "tests/properties/",
    "tests/invariants/",
    "tests/contract/",
    "tests/integration/",
]
# Disable progress bar (cleaner CI output).
no_progress = true
# Note: mutmut only mutates `*.py` files, so stray artifacts such as
# `*.bak` and `__pycache__/` are excluded automatically.

