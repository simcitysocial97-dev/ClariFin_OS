[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N"]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults (FastAPI compatibility)
    "B904",  # raise from err
    "E722",  # bare except
    "N806",  # variable in function should be lowercase
    "E402",  # module level import not at top
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true

explicit_package_bases = true

exclude = [
        ]

# External third-party libraries only
[[tool.mypy.overrides]]
module = ["camelot.*", "pdfplumber.*", "cachetools.*", "fastapi.*", "pydantic.*", "pandas.*", "uvicorn.*", "sqlite3"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["camelot"]
ignore_missing_imports = true
no_implicit_reexport = false
