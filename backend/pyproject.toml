# backend/pyproject.toml
# Scoped configuration authority for the backend source tree.
#
# M10 note:
#   * Dependencies are NOT declared here — root pyproject.toml is the SINGLE
#     Python dependency authority (`.venv` single-venv architecture).
#   * Ruff / Black configuration are canonicalized at repo root
#     (root pyproject.toml [tool.ruff] / [tool.black]); there is NO
#     backend/ruff.toml (an earlier M10 note referenced one — it never
#     existed as a separate authority; root config is the single authority).
#   * This file remains the authority for pytest / Mypy-strict / Mutmut /
#     Hypothesis because backend tests resolve their rootdir here.

[tool.mypy]
python_version = "3.12"
strict = true

namespace_packages = false

# Stubs directory for third-party libraries and cross-boundary modules.
# The stubs/ tree contains minimal py.typed-compatible stub packages:
#   * camelot/__init__.pyi     — third-party PDF table extraction library
#   * runtime/platform/...     — repository runtime package, treated as
#     cross-boundary dependency by the strict backend boundary
# The runtime source itself is NOT on the mypy path here — the
# `verify-fast.sh` script runs mypy from the backend/ rootdir, where
# backend.src.stubs mirrors the runtime import surface used by the
# platform router. The actual runtime is loaded at HTTP boundary time
# (FastAPI startup) and via the `from src.* import` import path on
# `pythonpath = ["backend/src"]` (see root pyproject.toml [tool.pytest]).
# This isolation is the canonical fix for the historical stdlib
# `platform` module shadowing caused by `runtime/platform/` package
# being on the same path as Python's stdlib.
mypy_path = ["src/stubs"]

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true

exclude = [
    "tests/",
    "mutants/",
]

# Test configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["probes", "mutants", "invariants/_m4_exit_probe"]
pythonpath = ["src", "tests"]
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "capability: mark test as capability smoke test",
    "contract: mark test as contract test",
    "property: mark test as property test",
    "invariant: mark test as invariant test",
    "golden: mark test as golden dataset test",
    "meta: mark test as meta test",
    "slow: marks tests as slow (deselect with '-m not slow')",
    "mutation: marks tests specifically for mutation testing",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "performance: marks performance tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:src.core.dtos.*",
    "ignore::pytest.PytestDeprecationWarning",
    "ignore::_pytest.warning_types.PytestAssertRewriteWarning",
    "ignore:Please use `import python_multipart` instead:PendingDeprecationWarning",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--no-header",
]
timeout = 60

[tool.hypothesis]
default_profile = "default"

[tool.hypothesis.profiles]
default = { max_examples = 20, deadline = 5000 }
ci = { max_examples = 150, deadline = 10000 }
nightly = { max_examples = 1000, deadline = 30000 }

# External third-party libraries only
[[tool.mypy.overrides]]
module = ["pandas", "pdfplumber.*", "cachetools.*", "fastapi.*", "pydantic.*", "uvicorn.*", "sqlite3"]
ignore_missing_imports = true

