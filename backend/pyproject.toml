source_paths = ["src/engines/credit_card_engine"]
also_copy = ["src"]
runner = "python3 -m pytest"
pytest_add_cli_args_test_selection = [
    "tests/unit/engines/credit_card",
    "tests/properties/credit_card_engine",
    "tests/capability/credit_cards"
]
no_progress = true
