[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # do not perform function calls in argument defaults (FastAPI does this)
    "B904",  # raise from err (not critical for this codebase)
    "E722",  # bare except (existing pattern in codebase)
    "N806",  # variable in function should be lowercase (constants in functions)
    "E402",  # module level import not at top (sys.path manipulation pattern)
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["camelot.*", "pdfplumber.*", "cachetools.*", "fastapi.*", "pydantic.*", "pandas.*", "uvicorn.*"]
ignore_missing_imports = true

# Per-file overrides for type annotation issues
[[tool.mypy.overrides]]
module = ["src.categorizer", "src.statement_extractor", "src.csv_importer", "src.metadata_extractor", "src.db", "src.api", "src.engines.nudge_engine", "src.engines.insight_generator", "src.engines.behavior_engine", "src.engines.balance_engine", "src.errors"]
disallow_untyped_defs = false
check_untyped_defs = false
ignore_errors = true

# Common layer utilities (have mixed typing)
[[tool.mypy.overrides]]
module = ["src.common.*"]
disallow_untyped_defs = false
check_untyped_defs = false

# Routers + health: allow missing imports and untyped defs for now
[[tool.mypy.overrides]]
module = ["src.routers.*", "src.health", "src.config", "src.logger"]
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true

# Domain layer: enforce strict type checking (models, repositories)
[[tool.mypy.overrides]]
module = [
    "src.repositories.*",
    "src.models.*",
]
ignore_errors = false
