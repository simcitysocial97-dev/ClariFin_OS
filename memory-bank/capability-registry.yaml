# Capability Registry — canonical source of truth for ClariFin_OS business capabilities
capabilities:
  - id: household_cashflow
    name: Household Cashflow
    description: >
      Compute monthly household cashflow analysis including income, expenses, surplus/deficit,
      true savings adjusted for financial events, and credit dependency ratios.
    criticality: high
    risk: low
    routers:
      - src/routers/cashflow.py
    services:
      - src/services/cashflow_service.py
    engines:
      - src/engines/cashflow_engine.py
    repositories:
      - src/repositories/cashflow_repository.py
    tables:
      - transactions
      - accounts
      - financial_events
      - cashflow_summaries
    golden_datasets:
      - tests/golden/datasets/normal_household.json
      - tests/golden/datasets/salary_only.json
      - tests/golden/datasets/salary_plus_loan.json
      - tests/golden/datasets/family_household.json
    property_tests:
      - tests/properties/test_cashflow.py
      - tests/properties/cashflow/test_engine_properties.py
    invariants:
      - tests/invariants/test_cashflow.py
    architecture_tests:
      - tests/architecture
    contracts:
      - POST /api/cashflow/monthly
      - GET /api/cashflow/trends
    dependencies: []
    failure_impact: >
      Core financial visibility. Loss causes inability to determine surplus/deficit,
      leading to incorrect budget and planning decisions.

  - id: debt_management
    name: Debt Management
    description: >
      Compute loan schedules, EMI calculations, foreclosure amounts, prepayment simulations,
      and loan health metrics for personal loans and other debt instruments.
    criticality: high
    risk: medium
    routers:
      - src/routers/loans.py
    services:
      - src/services/loan_service.py
      - src/services/loan_analysis_service.py
      - src/services/loan_simulation_service.py
    engines:
      - src/engines/loan_engine/amortization.py
      - src/engines/loan_engine/emi.py
      - src/engines/loan_engine/floating_rate.py
      - src/engines/loan_engine/foreclosure.py
      - src/engines/loan_engine/metrics.py
      - src/engines/loan_engine/models.py
      - src/engines/loan_engine/prepayment.py
      - src/engines/loan_engine/utils.py
    repositories:
      - src/repositories/loan_repository.py
      - src/repositories/loan_payment_repository.py
    tables:
      - loans
      - loan_payments
      - credit_card_emi
    golden_datasets:
      - tests/golden/datasets/salary_plus_loan.json
      - tests/golden/datasets/multiple_loans.json
      - tests/golden/datasets/high_debt_household.json
    property_tests:
      - tests/properties/test_loan.py
      - tests/properties/lending/test_engine_properties.py
    invariants:
      - tests/invariants/test_loan.py
    architecture_tests:
      - tests/architecture
    contracts:
      - POST /api/loans
      - GET /api/loans/{loan_id}/schedule
      - POST /api/loans/foreclosure-calculate
      - POST /api/loans/prepayment-simulate
    dependencies:
      - household_cashflow
    failure_impact: >
      Loan repayment planning breaks. Users cannot determine correct EMIs, foreclosure
      amounts, or prepayment savings, leading to incorrect debt decisions.

  - id: credit_cards
    name: Credit Cards
    description: >
      Analyze credit card statements, compute utilization ratios, track outstanding balances,
      detect EMI conversions and cash advances, and optimize credit card repayment strategies.
    criticality: high
    risk: medium
    routers:
      - src/routers/credit_cards.py
      - src/routers/cards_statements.py
    services:
      - src/services/credit_card_service.py
    engines:
      - src/engines/credit_card_engine/billing.py
      - src/engines/credit_card_engine/emi.py
      - src/engines/credit_card_engine/foreclosure.py
      - src/engines/credit_card_engine/interest.py
      - src/engines/credit_card_engine/metrics.py
      - src/engines/credit_card_engine/outstanding.py
      - src/engines/credit_card_engine/utilization.py
    repositories:
      - src/repositories/credit_card_repository.py
      - src/repositories/credit_card_statement_repository.py
    tables:
      - credit_cards
      - credit_card_statements
      - credit_card_emi
      - credit_card_foreclosure
    golden_datasets:
      - tests/golden/datasets/credit_card_revolver.json
      - tests/golden/datasets/cash_advance.json
      - tests/golden/datasets/cc_statement_scenario.json
    property_tests:
      - tests/properties/test_credit_card_engine.py
      - tests/properties/credit_cards/test_engine_properties.py
    invariants:
      - tests/invariants/test_credit.py
    architecture_tests:
      - tests/architecture
    contracts:
      - POST /api/credit-cards
      - GET /api/credit-cards/{card_id}/statement
      - POST /api/credit-cards/{card_id}/emi-convert
      - POST /api/credit-cards/foreclosure-calculate
    dependencies:
      - household_cashflow
    failure_impact: >
      Credit card repayment planning breaks. Users cannot optimize payment strategies or
      understand true cost of revolving debt, leading to excessive interest charges.

  - id: financial_health
    name: Financial Health
    description: >
      Assess financial health through behaviour profiling, resilience scoring, stress detection,
      savings rate analysis, and wellness metrics derived from transaction patterns.
    criticality: high
    risk: low
    routers:
      - src/routers/behavior.py
      - src/routers/behaviour.py
    services:
      - src/services/behavior_service.py
      - src/services/behaviour_service.py
    engines:
      - src/engines/behaviour_engine/account.py
      - src/engines/behaviour_engine/cashflow.py
      - src/engines/behaviour_engine/credit_dependency.py
      - src/engines/behaviour_engine/debt.py
      - src/engines/behaviour_engine/income.py
      - src/engines/behaviour_engine/lifestyle.py
      - src/engines/behaviour_engine/patterns.py
      - src/engines/behaviour_engine/profile.py
      - src/engines/behaviour_engine/resilience.py
      - src/engines/behaviour_engine/savings.py
      - src/engines/behaviour_engine/stress.py
      - src/engines/behaviour_engine/wellness.py
    repositories:
      - src/repositories/behaviour_repository.py
    tables:
      - behaviour_profiles
      - behaviour_scores
      - financial_events
    golden_datasets:
      - tests/golden/datasets/normal_household.json
      - tests/golden/datasets/high_debt_household.json
      - tests/golden/datasets/irregular_income.json
    property_tests:
      - tests/properties/test_behavior_engine.py
      - tests/properties/behaviour/test_engine_properties.py
    invariants:
      - tests/invariants/test_behaviour.py
    architecture_tests:
      - tests/architecture
    contracts:
      - GET /api/behavior/profile
      - GET /api/behavior/wellness
      - GET /api/behavior/resilience
      - GET /api/behavior/stress
    dependencies:
      - household_cashflow
      - transaction_intelligence
    failure_impact: >
      Financial health assessments become unreliable. Users lose visibility into behaviour
      patterns, stress indicators, and wellness scores needed for corrective action.

  - id: forecasting
    name: Forecasting
    description: >
      Project future cashflow, liquidity, and financial goals using deterministic forecasting
      models, scenario analysis, and optimization algorithms.
    criticality: medium
    risk: low
    routers:
      - src/routers/financial_intelligence.py
      - src/routers/scenarios.py
      - src/routers/goals.py
    services:
      - src/services/financial_intelligence_service.py
    engines:
      - src/engines/financial_intelligence/forecasting.py
      - src/engines/financial_intelligence/goal_planner.py
      - src/engines/financial_intelligence/intelligence.py
      - src/engines/financial_intelligence/optimization.py
      - src/engines/financial_intelligence/scenario.py
    repositories:
      - src/repositories/financial_goal_repository.py
      - src/repositories/forecast_repository.py
    tables:
      - financial_goals
      - forecasts
      - scenarios
      - financial_events
    golden_datasets:
      - tests/golden/datasets/salary_only.json
      - tests/golden/datasets/salary_plus_loan.json
      - tests/golden/datasets/irregular_income.json
    property_tests:
      - tests/properties/test_forecast.py
      - tests/properties/forecasting/test_engine_properties.py
    invariants:
      - tests/invariants/test_forecast.py
    architecture_tests:
      - tests/architecture
    contracts:
      - GET /api/financial-intelligence/forecast
      - POST /api/financial-intelligence/scenario
      - GET /api/goals
      - POST /api/goals
    dependencies:
      - household_cashflow
      - debt_management
      - credit_cards
    failure_impact: >
      Long-term planning becomes unreliable. Users cannot project liquidity, set achievable
      financial goals, or evaluate what-if scenarios for major decisions.

  - id: transaction_intelligence
    name: Transaction Intelligence
    description: >
      Detect hidden financial patterns in transactions including credit card payments, loan EMIs,
      and cash conversion cycles to improve cashflow accuracy and spending classification.
    criticality: high
    risk: low
    routers:
      - src/routers/transactions.py
      - src/routers/patterns.py
    services:
      - src/services/transaction_intelligence_service.py
    engines:
      - src/engines/transaction_intelligence/cash_conversion_detector.py
      - src/engines/transaction_intelligence/cc_payment_detector.py
      - src/engines/transaction_intelligence/detector_result.py
      - src/engines/transaction_intelligence/loan_emi_detector.py
    repositories:
      - src/repositories/transaction_repository.py
      - src/repositories/pattern_repository.py
    tables:
      - transactions
      - patterns
      - liquidity_patterns
    golden_datasets:
      - tests/golden/datasets/cc_statement_scenario.json
      - tests/golden/datasets/cash_advance.json
      - tests/golden/datasets/normal_household.json
    property_tests:
      - tests/properties/credit_cards/test_engine_properties.py
      - tests/properties/transaction_intelligence/__init__.py
    invariants:
      - tests/invariants/test_statement.py
      - tests/invariants/test_transaction.py
    architecture_tests:
      - tests/architecture
    contracts:
      - POST /api/transactions/detect-patterns
      - GET /api/patterns/credit-card-payments
      - GET /api/patterns/loan-emis
    dependencies:
      - household_cashflow
      - credit_cards
      - debt_management
    failure_impact: >
      Hidden financial obligations go undetected. Users miss credit card payments, loan EMIs,
      and cash conversion cycles, leading to inaccurate cashflow and unexpected charges.

  - id: reconciliation
    name: Reconciliation
    description: >
      Match debit and credit transactions across accounts to identify matched pairs, unmatched items,
      and settlement patterns using deterministic bipartite matching algorithms.
    criticality: high
    risk: medium
    routers:
      - src/routers/reconciliation.py
    services:
      - src/services/reconciliation_service.py
    engines:
      - src/engines/reconciliation_engine.py
    repositories:
      - src/repositories/reconciliation_repository.py
      - src/repositories/reconciliation_audit_repository.py
    tables:
      - transactions
      - reconciliation_matches
      - reconciliation_audit_log
    golden_datasets:
      - tests/golden/datasets/normal_household.json
      - tests/golden/datasets/salary_plus_loan.json
    property_tests:
      - tests/test_reconciliation.py
      - tests/test_reconciliation_determinism.py
      - tests/test_reconciliation_stats.py
    invariants:
      - tests/invariants/test_transaction.py
    architecture_tests:
      - tests/architecture
    contracts:
      - POST /api/reconciliation/run
      - GET /api/reconciliation/{session_id}/matches
      - GET /api/reconciliation/unmatched
    dependencies:
      - household_cashflow
      - transaction_intelligence
    failure_impact: >
      Reconciliation accuracy breaks. Users cannot verify transaction completeness or detect
      missing/suspicious transactions across accounts, undermining audit confidence.

  - id: financial_events
    name: Financial Events
    description: >
      Track lifecycle of financial events across accounts including settlements, rollovers,
      refunds, and transfers with full lineage and audit trail.
    criticality: medium
    risk: low
    routers:
      - src/routers/financial_intelligence.py
    services:
      - src/services/financial_events_service.py
    engines:
      - src/engines/financial_events/lineage_walker.py
    repositories:
      - src/repositories/financial_event_repository.py
    tables:
      - financial_events
      - financial_event_lifecycle_log
    golden_datasets:
      - tests/golden/datasets/cc_statement_scenario.json
      - tests/golden/datasets/salary_plus_loan.json
    property_tests:
      - tests/test_financial_events.py
    invariants:
      - tests/invariants/test_transaction.py
    architecture_tests:
      - tests/architecture
    contracts:
      - POST /api/financial-events
      - GET /api/financial-events/{event_id}/lineage
      - POST /api/financial-events/{event_id}/transition
    dependencies:
      - household_cashflow
      - transaction_intelligence
    failure_impact: >
      Event tracking breaks. Users lose audit trail for settlements, refunds, and transfers,
      making transaction history incomplete and non-compliant.

  - id: recommendations
    name: Recommendations
    description: >
      Generate personalized financial recommendations based on account state, behaviour scores,
      cashflow patterns, and optimization algorithms.
    criticality: medium
    risk: low
    routers:
      - src/routers/optimization.py
    services:
      - src/services/financial_intelligence_service.py
    engines:
      - src/engines/recommendation_engine/recommendations.py
      - src/engines/financial_intelligence/optimization.py
      - src/engines/nudge_engine.py
    repositories:
      - src/repositories/financial_goal_repository.py
    tables:
      - recommendations
      - financial_goals
      - behaviour_scores
    golden_datasets:
      - tests/golden/datasets/normal_household.json
      - tests/golden/datasets/high_debt_household.json
      - tests/golden/datasets/credit_card_revolver.json
    property_tests:
      - tests/test_recommendation_engine.py
      - tests/test_optimization_engine.py
    invariants:
      - tests/invariants/test_behaviour.py
    architecture_tests:
      - tests/architecture
    contracts:
      - GET /api/optimization/recommendations
      - GET /api/optimization/nudges
    dependencies:
      - household_cashflow
      - debt_management
      - credit_cards
      - financial_health
    failure_impact: >
      Users miss actionable insights. No optimization suggestions or behavioural nudges reduce
      platform's ability to drive positive financial change.

  - id: account_management
    name: Account Management
    description: >
      Manage bank accounts and linked accounts, track balances, detect dormant accounts,
      compute account metrics, and maintain account lifecycle state.
    criticality: high
    risk: low
    routers:
      - src/routers/accounts.py
      - src/routers/managed_accounts.py
    services:
      - src/services/account_service.py
    engines:
      - src/engines/account_engine/balance.py
      - src/engines/account_engine/cashflow.py
      - src/engines/account_engine/dormant.py
      - src/engines/account_engine/history.py
      - src/engines/account_engine/lifecycle.py
      - src/engines/account_engine/metrics.py
    repositories:
      - src/repositories/account_repository.py
      - src/repositories/account_balance_repository.py
      - src/repositories/account_link_repository.py
    tables:
      - accounts
      - account_balances
      - account_links
    golden_datasets:
      - tests/golden/datasets/normal_household.json
      - tests/golden/datasets/salary_only.json
      - tests/golden/datasets/family_household.json
    property_tests:
      - tests/test_account_engine.py
      - tests/properties/behaviour/test_engine_properties.py
    invariants:
      - tests/invariants/test_account.py
    architecture_tests:
      - tests/architecture
    contracts:
      - POST /api/accounts
      - GET /api/accounts/{account_id}
      - GET /api/accounts/{account_id}/metrics
      - POST /api/accounts/link
    dependencies: []
    failure_impact: >
      Account data becomes inconsistent. Users cannot track balances or detect dormant accounts
      leading to inaccurate financial position reporting.

  - id: pattern_analysis
    name: Pattern Analysis
    description: >
      Identify spending patterns, liquidity patterns, and recurring transaction categories
      to improve cashflow classification and financial insights.
    criticality: medium
    risk: low
    routers:
      - src/routers/patterns.py
    services:
      - src/services/pattern_service.py
    engines:
      - src/engines/insight_generator.py
    repositories:
      - src/repositories/pattern_repository.py
      - src/repositories/liquidity_pattern_repository.py
    tables:
      - patterns
      - liquidity_patterns
      - transactions
    golden_datasets:
      - tests/golden/datasets/irregular_income.json
      - tests/golden/datasets/normal_household.json
    property_tests:
      - tests/test_pattern_repository.py
    invariants:
      - tests/invariants/test_transaction.py
    architecture_tests:
      - tests/architecture
    contracts:
      - GET /api/patterns
      - GET /api/patterns/liquidity
      - POST /api/patterns/detect
    dependencies:
      - household_cashflow
      - transaction_intelligence
    failure_impact: >
      Pattern detection breaks. Users lose automated categorization and recurring transaction
      identification, reducing cashflow accuracy and insight generation.