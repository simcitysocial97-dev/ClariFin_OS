# Validation Risk Rules
# Determines which validation strategy to use based on changed file patterns.
# Patterns use glob-style matching (simplified).

rules:
  # Documentation changes - minimal risk
  - pattern: "**/*.md"
    strategy: fast
    risk: LOW

  - pattern: "docs/**"
    strategy: fast
    risk: LOW

  # Source code changes - selective verification
  - pattern: "backend/src/routers/**"
    strategy: selective
    risk: MEDIUM

  - pattern: "backend/src/services/**"
    strategy: selective
    risk: MEDIUM

  - pattern: "backend/src/engines/**"
    strategy: selective
    risk: HIGH

  - pattern: "backend/src/repositories/**"
    strategy: selective
    risk: HIGH

  # Schema/Database changes - full verification required
  - pattern: "backend/src/models/**"
    strategy: full
    risk: CRITICAL

  - pattern: "backend/src/db.py"
    strategy: full
    risk: CRITICAL

  - pattern: "backend/scripts/migration_*.py"
    strategy: full
    risk: CRITICAL

  # Configuration changes - selective
  - pattern: "backend/src/config.py"
    strategy: selective
    risk: MEDIUM

  - pattern: "backend/pyproject.toml"
    strategy: selective
    risk: MEDIUM

  # Tests changes - minimal risk
  - pattern: "backend/tests/**"
    strategy: fast
    risk: LOW

  # Frontend changes - selective (if any backend coupling)
  - pattern: "frontend/**"
    strategy: selective
    risk: MEDIUM

  # Default fallback
  - pattern: "*"
    strategy: full
    risk: UNKNOWN