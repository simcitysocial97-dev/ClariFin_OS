# ClariFin OS — Verification Runtime Configuration
#
# O-2 configuration authority split:
#   THIS FILE (verification.yaml) is the canonical source of truth for:
#     - workflow definitions (single-command scripts),
#     - capability declarations (id/name/description/categories/scopes/workflows),
#     - script inventory,
#     - coverage/threshold metadata consumed by the registry and planner.
#   The `VerificationRegistry` loads this file at runtime and merges its
#   built-in defaults field-by-field (yaml wins over defaults on every key).
#
# `profiles.py` is the canonical source of truth for:
#   - multi-command task-list execution under the profile alias surface
#     (`verify quick|backend|frontend|contracts|graph|full|runtime|golden|playwright`).
#   Each alias profile's ``tasks`` tuple drives direct subprocess execution
#   via the facade's alias path; these tasks are NOT loaded from this yaml.
#
# An executable reconciliation test pins the relationship: every alias name
# must have a corresponding workflow (or be explicitly allowlisted as
# alias-only), and every yaml workflow must reference a script that exists
# on disk.
#
# Do not edit manually — use verification CLI commands where possible.

version: "1.0"

# Program 1: Infrastructure foundation
infrastructure:
  python_version: "3.12"
  node_version: "24"
  cache_strategy: "dependency-hash"

# Program 2: Repository Intelligence (implemented)
intelligence:
  enabled: true

# Program 3: Verification CLI (implemented)
cli:
  enabled: true

# Program 4: Evidence Platform (implemented)
evidence:
  enabled: true

# Program 5: Backend Verification (current thresholds)
backend:
  coverage_threshold: 40
  mutation_threshold: 60
  paths:
    source: "backend/src"
    tests: "backend/tests"

# Program 6: Frontend Verification (placeholder)
frontend:
  enabled: true
  paths:
    source: "frontend/src"
    tests: "frontend/tests"

# Mutation testing thresholds (C42.7 / M9-C55)
mutation_thresholds:
  full_campaign: 80   # minimum mutation score % for full campaign pass
  incremental: 75     # minimum mutation score % for incremental/targeted runs
  smoke: 0            # smoke runs are not gated (score reported only)

# Regression detection thresholds (M9-C55)
regression_thresholds:
  coverage_drop_warning: 5      # coverage drop > this % → WARNING
  coverage_drop_critical: 10    # coverage drop > this % → CRITICAL
  mutation_drop_warning: 10     # mutation score drop > this % → WARNING
  mutation_drop_critical: 15    # mutation score drop > this % → CRITICAL
  test_count_drop_warning: 20   # test count drop > this % → WARNING

# Verification workflows (authoritative). Every command is invoked through the
# bash interpreter so scripts need not carry the executable bit in git.
workflows:
  quick:
    name: "Quick Verification"
    description: "Fast local checks (lint, typecheck, unit tests)"
    category: "capability"
    scope: "quick"
    command: "bash .github/scripts/run_fast_checks.sh"
    estimated_duration_seconds: 60
    scopes: ["quick"]
    capabilities: ["quick"]

  backend:
    name: "Backend Verification"
    description: "Full backend verification suite"
    category: "capability"
    scope: "backend"
    command: "bash .github/scripts/run_backend_verification.sh"
    estimated_duration_seconds: 300
    scopes: ["backend", "contracts", "property"]
    capabilities: ["loan-engine", "reconciliation", "ledger"]

  frontend:
    name: "Frontend Verification"
    description: "Full frontend verification suite"
    category: "contract_frontend"
    scope: "frontend"
    command: "bash .github/scripts/run_frontend_verification.sh"
    # Measured on an idle 4-core workstation: lint 56 s + typecheck 21 s +
    # build 65 s + vitest 107 s = 249 s for 1367 frontend tests. The previous
    # value of 180 s was below the command's own cost, and since
    # `_timeout_for` derives the task budget as 2x the estimate, it produced a
    # 360 s ceiling for a command that takes 249 s idle and reached 345 s on a
    # loaded host — about 4% headroom, so it passed or failed according to
    # machine load rather than according to the code. Reconcile run
    # execplan-b357471cbfa8 recorded exactly that: `timeout 360.50s command
    # exceeded 360s`, with the streamed log showing lint 74 s, typecheck 27 s,
    # build 69 s, and vitest still running at 175 s when it was killed
    # (exit=143).
    #
    # This is the only workflow whose declared estimate was below its measured
    # cost. For comparison, as measured in the same run: backend 300 declared /
    # 135 actual, contracts 180 / 107, quick 60 / 46, runtime 2700 / 1493. So
    # this is one wrong data point being corrected against a measurement, not a
    # budget being relaxed to fit a failure.
    #
    # 300 s matches how sibling workflows are sized (backend, property and
    # migration are all 300-600) and yields a 600 s task ceiling: comfortably
    # above the 345 s loaded cost, and still a hard bound on a genuine hang.
    # No coverage, mutation or regression threshold is involved — those live in
    # the thresholds block below and are untouched.
    estimated_duration_seconds: 300
    scopes: ["frontend", "contracts"]
    capabilities: ["api-contracts"]

  contracts:
    name: "Contract Verification"
    description: "Contract tests for all capabilities"
    category: "contract"
    scope: "contracts"
    command: "bash .github/scripts/run_contract_tests.sh"
    estimated_duration_seconds: 180
    scopes: ["contracts"]
    capabilities: ["loan-engine", "reconciliation", "ledger", "api-contracts"]

  property:
    name: "Property Testing"
    description: "Property-based testing for loan engine"
    category: "property"
    scope: "property"
    command: "bash .github/scripts/run_property_tests.sh"
    estimated_duration_seconds: 300
    scopes: ["property"]
    capabilities: ["loan-engine", "reconciliation"]

  mutation:
    name: "Mutation Testing"
    description: "Mutation testing for critical modules"
    category: "mutation"
    scope: "mutation"
    command: "bash .github/scripts/run_mutation_selective.sh"
    estimated_duration_seconds: 600
    scopes: ["mutation"]
    capabilities: ["mutation-analysis"]

  integration:
    name: "Integration Tests"
    description: "End-to-end integration tests"
    category: "integration"
    scope: "integration"
    command: "bash .github/scripts/run_integration_tests.sh"
    estimated_duration_seconds: 600
    scopes: ["integration"]
    capabilities: ["loan-engine"]

  migration:
    name: "Migration Verification"
    description: "Database migration verification"
    category: "migration"
    scope: "migration"
    command: "bash .github/scripts/run_migration_verification.sh"
    estimated_duration_seconds: 120
    scopes: ["migration"]
    capabilities: ["migrations"]

  repository:
    name: "Repository Verification"
    description: "Full repository verification"
    category: "architectural"
    scope: "repository"
    command: "bash .github/scripts/run_full_verification.sh"
    estimated_duration_seconds: 1800
    scopes: ["repository"]

  full:
    name: "Full Verification"
    description: "Complete verification suite"
    category: "architectural"
    scope: "full"
    command: "bash .github/scripts/run_full_verification.sh"
    estimated_duration_seconds: 3600
    scopes: ["full"]

  runtime:
    name: "Runtime Verification"
    description: "Engineering Runtime self-verification"
    category: "architectural"
    scope: "runtime"
    command: "bash .github/scripts/run_runtime_verification.sh"
    estimated_duration_seconds: 2700
    scopes: ["runtime"]
    capabilities: ["runtime-verification"]

  golden:
    name: "Golden Regression"
    description: "Golden dataset regression tests"
    category: "capability"
    scope: "golden"
    command: "bash .github/scripts/run_golden_tests.sh"
    estimated_duration_seconds: 600
    scopes: ["golden"]
    capabilities: ["golden-regression"]

  playwright:
    name: "Playwright E2E"
    description: "End-to-end browser tests"
    category: "integration"
    scope: "playwright"
    command: "bash .github/scripts/run_playwright_tests.sh"
    estimated_duration_seconds: 1800
    scopes: ["playwright"]
    capabilities: ["e2e-tests"]

# Verification scripts
scripts:
  run_fast_checks:
    name: "Fast Checks"
    path: ".github/scripts/run_fast_checks.sh"
    description: "Fast lint, typecheck, format and unit tests"
    category: "capability"
    scope: "quick"
    estimated_duration_seconds: 60

  run_contract_tests:
    name: "Contract Tests"
    path: ".github/scripts/run_contract_tests.sh"
    description: "Contract tests for all capabilities"
    category: "contract"
    scope: "contracts"
    estimated_duration_seconds: 180

  run_backend_verification:
    name: "Backend Verification"
    path: ".github/scripts/run_backend_verification.sh"
    description: "Contract, invariant and property tests for the backend"
    category: "capability"
    scope: "backend"
    estimated_duration_seconds: 300

  run_frontend_verification:
    name: "Frontend Verification"
    path: ".github/scripts/run_frontend_verification.sh"
    description: "ESLint, TypeScript typecheck and Vitest for the frontend"
    category: "contract_frontend"
    scope: "frontend"
    estimated_duration_seconds: 180

  run_property_tests:
    name: "Property Tests"
    path: ".github/scripts/run_property_tests.sh"
    description: "Property-based tests for loan engine"
    category: "property"
    scope: "property"
    estimated_duration_seconds: 300

  run_mutation_selective:
    name: "Selective Mutation Testing"
    path: ".github/scripts/run_mutation_selective.sh"
    description: "Mutation testing for critical modules"
    category: "mutation"
    scope: "mutation"
    estimated_duration_seconds: 600

  run_migration_verification:
    name: "Migration Verification"
    path: ".github/scripts/run_migration_verification.sh"
    description: "Database migration integrity checks"
    category: "migration"
    scope: "migration"
    estimated_duration_seconds: 120

  run_integration_tests:
    name: "Integration Tests"
    path: ".github/scripts/run_integration_tests.sh"
    description: "API integration tests"
    category: "integration"
    scope: "integration"
    estimated_duration_seconds: 600

  run_full_verification:
    name: "Full Verification"
    path: ".github/scripts/run_full_verification.sh"
    description: "Complete backend test suite"
    category: "architectural"
    scope: "repository"
    estimated_duration_seconds: 1800

  run_runtime_verification:
    name: "Runtime Verification"
    path: ".github/scripts/run_runtime_verification.sh"
    description: "Engineering Runtime self-verification"
    category: "architectural"
    scope: "runtime"
    estimated_duration_seconds: 2700

  run_golden_tests:
    name: "Golden Regression Tests"
    path: ".github/scripts/run_golden_tests.sh"
    description: "Golden dataset regression tests"
    category: "capability"
    scope: "golden"
    estimated_duration_seconds: 600

  run_playwright_tests:
    name: "Playwright E2E Tests"
    path: ".github/scripts/run_playwright_tests.sh"
    description: "End-to-end Playwright browser tests"
    category: "integration"
    scope: "playwright"
    estimated_duration_seconds: 1800

# Capabilities.
# NOTE: requirement definitions live in runtime/foundation/verification/registry/registry.py
# (default capabilities). This config overrides scopes/workflows/scripts/modules only;
# requirements are inherited from the defaults and are NOT overridden here.
capabilities:
  loan-engine:
    name: "Loan Engine"
    description: "Core loan calculation engine"
    category: "capability"
    scopes: ["backend", "property", "contracts", "integration", "repository"]
    workflows: ["property", "contracts", "backend"]
    scripts: ["run_property_tests", "run_contract_tests", "run_backend_verification", "run_fast_checks"]
    modules: ["backend/src/engines/loan_engine"]

  reconciliation:
    name: "Reconciliation Engine"
    description: "Financial reconciliation engine"
    category: "capability"
    scopes: ["backend", "property", "contracts", "integration", "repository"]
    workflows: ["property", "contracts", "backend"]
    scripts: ["run_property_tests", "run_contract_tests", "run_backend_verification", "run_fast_checks"]
    modules: ["backend/src/engines/reconciliation_engine.py"]

  ledger:
    name: "Ledger Service"
    description: "General ledger and accounting"
    category: "capability"
    scopes: ["backend", "contracts", "integration", "repository"]
    workflows: ["contracts", "backend", "integration"]
    scripts: ["run_contract_tests", "run_backend_verification", "run_fast_checks"]
    modules: ["backend/src/engines/ledger_audit_engine.py"]

  api-contracts:
    name: "API Contracts"
    description: "OpenAPI contract verification"
    category: "contract"
    scopes: ["contracts", "frontend", "backend", "repository"]
    workflows: ["contracts", "frontend", "backend"]
    scripts: ["run_contract_tests", "run_frontend_verification", "run_backend_verification"]
    # `modules` becomes the capability's `affected_by_paths`
    # (capability_contract.py), and this yaml is the authority that overrides
    # registry.py's defaults.
    #
    # Two corrections, both on values that were silently wrong:
    #
    # 1. `frontend/src` never existed once the frontend moved to app/lib/
    #    components/hooks; it is the original Program 1-4 scaffolding value from
    #    c04de0f1. Because the yaml wins over the registry defaults, it voided
    #    `frontend/lib` — the module the `api-contract-frontend` requirement
    #    itself names ("Frontend contract compliance", module `frontend/lib`) —
    #    so no frontend file resolved to this capability by path. The two
    #    authorities are now identical, which they had not been since 112cc7fd.
    #
    # 2. `frontend/scripts/verify-mock-sync.ts` is the verifier that holds the
    #    MSW mock handlers to those same canonical Zod schemas ("this script
    #    validates that MSW mock handler responses conform to the canonical Zod
    #    schemas") — the same frontend contract obligation, in the same surface.
    #    Unregistered, it resolved to no capability and blocked the fail-closed
    #    review obligation. Registered as one file rather than as the whole
    #    `frontend/scripts` directory: its siblings there are test-metadata and
    #    parser-debug tooling, which are not contract obligations.
    #
    # Correction 1 has no effect on the current change set (no `frontend/lib`
    # file is in it), so it cannot change this run's plan; it is recorded here
    # rather than left as a landmine for the next change to `frontend/lib`.
    modules: ["backend/src", "frontend/lib", "frontend/scripts/verify-mock-sync.ts"]

  migrations:
    name: "Database Migrations"
    description: "Database migration verification"
    category: "migration"
    scopes: ["migration", "backend", "repository"]
    workflows: ["migration", "backend"]
    scripts: ["run_migration_verification", "run_backend_verification"]
    modules: ["backend/src/migrations"]

  runtime-verification:
    name: "Runtime Verification"
    description: "Engineering Runtime self-verification"
    category: "architectural"
    scopes: ["runtime"]
    workflows: ["runtime"]
    scripts: ["run_runtime_verification"]
    # `modules` becomes the capability's `affected_by_paths`
    # (capability_contract.py). This was empty, so the Platform Console's own
    # page layer had no registry mapping at all.
    #
    # `runtime-verification` is already the registered owner of that surface and
    # the graph says so itself: every Platform Console hook edge in
    # runtime/generated/cross-layer-graph.json is
    # `frontend:hook:frontend-platform:* -> runtime-verification
    # (capability, depends_on)`. `frontend/lib/hooks/use-platform-diagnostics.ts`
    # therefore already resolved here. Only the route layer underneath it was
    # unregistered, which is why changing a Platform Console page produced an
    # unmapped entry instead of a runtime-verification obligation.
    modules: ["frontend/app/platform"]

  golden-regression:
    name: "Golden Regression"
    description: "Golden dataset regression"
    category: "capability"
    scopes: ["golden"]
    workflows: ["golden"]
    scripts: ["run_golden_tests"]
    modules: []

  mutation-analysis:
    name: "Mutation Analysis"
    description: "Mutation testing for critical modules"
    category: "mutation"
    scopes: ["mutation"]
    workflows: ["mutation"]
    scripts: ["run_mutation_selective"]
    modules: []

  e2e-tests:
    name: "End-to-End Tests"
    description: "End-to-end browser tests"
    category: "integration"
    scopes: ["playwright"]
    workflows: ["playwright"]
    scripts: ["run_playwright_tests"]
    # `modules` becomes the capability's `affected_by_paths`
    # (capability_contract.py). This was empty, so no changed file could ever
    # match the capability: every PR touching a Playwright spec or a
    # visual-regression snapshot resolved to UNMAPPED and blocked on the
    # fail-closed review obligation, even though Playwright verifies that
    # surface on the same event. The suite lives under frontend/tests/e2e.
    modules: ["frontend/tests/e2e"]

  balance-engine:
    name: "Balance Engine"
    description: "Running balance computation from transaction streams"
    category: "capability"
    scopes: ["backend", "property", "contracts", "integration", "repository"]
    workflows: ["property", "contracts", "backend"]
    scripts: ["run_property_tests", "run_contract_tests", "run_backend_verification", "run_fast_checks"]
    modules: ["backend/src/engines/balance_engine.py"]

  behaviour-engine:
    name: "Behaviour Engine"
    description: "Financial behaviour scoring and risk assessment"
    category: "capability"
    scopes: ["backend", "property", "contracts", "integration", "repository"]
    workflows: ["property", "contracts", "backend"]
    scripts: ["run_property_tests", "run_contract_tests", "run_backend_verification", "run_fast_checks"]
    modules: ["backend/src/engines/behaviour_engine"]

  cashflow-engine:
    name: "Cashflow Engine"
    description: "Cashflow classification and net-worth computation"
    category: "capability"
    scopes: ["backend", "property", "contracts", "integration", "repository"]
    workflows: ["property", "contracts", "backend"]
    scripts: ["run_property_tests", "run_contract_tests", "run_backend_verification", "run_fast_checks"]
    modules: ["backend/src/engines/cashflow_engine.py"]

  credit-card-engine:
    name: "Credit Card Engine"
    description: "Credit card billing, utilization and foreclosure"
    category: "capability"
    scopes: ["backend", "property", "contracts", "integration", "repository"]
    workflows: ["property", "contracts", "backend"]
    scripts: ["run_property_tests", "run_contract_tests", "run_backend_verification", "run_fast_checks"]
    modules: ["backend/src/engines/credit_card_engine"]

  financial-intelligence:
    name: "Financial Intelligence"
    description: "Forecasting, goal planning and scenario analysis"
    category: "capability"
    scopes: ["backend", "property", "contracts", "integration", "repository"]
    workflows: ["property", "contracts", "backend"]
    scripts: ["run_property_tests", "run_contract_tests", "run_backend_verification", "run_fast_checks"]
    modules: ["backend/src/engines/financial_intelligence"]

  account-engine:
    name: "Account Engine"
    description: "Account lifecycle, balance, cashflow and dormancy management"
    category: "capability"
    scopes: ["backend", "property", "contracts", "integration", "repository"]
    workflows: ["property", "contracts", "backend"]
    scripts: ["run_property_tests", "run_contract_tests", "run_backend_verification", "run_fast_checks"]
    modules: ["backend/src/engines/account_engine"]
